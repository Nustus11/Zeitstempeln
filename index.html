<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeitstempel">
<meta name="color-scheme" content="dark light">
<script>try{var th=localStorage.getItem("zs-theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th);}catch(e){}</script>
<title>Zeitstempel</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#000; --text:#fff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --glass:rgba(40,40,46,.42); --glass-strong:rgba(44,44,50,.72); --edge:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22);
  --sep:rgba(255,255,255,.1); --fill:rgba(118,118,128,.24); --shadow:0 10px 40px rgba(0,0,0,.35);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --indigo:#5E5CE6;
  --b1:#1d4ed8; --b2:#0f766e; --b3:#6d28d9;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]){
    --bg:#f2f2f7; --text:#000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3);
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.82); --edge:rgba(255,255,255,.7); --hi:rgba(255,255,255,.9);
    --sep:rgba(60,60,67,.14); --fill:rgba(118,118,128,.12); --shadow:0 10px 40px rgba(31,38,135,.12);
    --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --indigo:#5856D6;
    --b1:#93c5fd; --b2:#99f6e4; --b3:#c4b5fd;
  }
}
:root[data-theme=light]{
    --bg:#f2f2f7; --text:#000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3);
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.82); --edge:rgba(255,255,255,.7); --hi:rgba(255,255,255,.9);
    --sep:rgba(60,60,67,.14); --fill:rgba(118,118,128,.12); --shadow:0 10px 40px rgba(31,38,135,.12);
    --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --indigo:#5856D6;
    --b1:#93c5fd; --b2:#99f6e4; --b3:#c4b5fd;
  }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:17px;letter-spacing:-.01em;color:var(--text);background:var(--bg);min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 110px);
  -webkit-font-smoothing:antialiased;
}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.blobs i:nth-child(1){width:420px;height:420px;background:var(--b1);top:-140px;left:-120px}
.blobs i:nth-child(2){width:360px;height:360px;background:var(--b2);top:30%;right:-160px}
.blobs i:nth-child(3){width:380px;height:380px;background:var(--b3);bottom:-160px;left:-80px}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}

/* Kopf */
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.nav .back{background:none;border:0;color:var(--blue);font:inherit;padding:8px 0;display:flex;align-items:center;gap:2px}
.ttl{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 4px 2px}
.subttl{color:var(--sec);font-size:15px;margin:0 4px 18px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);font-size:22px;border:0;font-weight:400;padding:0}
.round svg{width:20px;height:20px}

/* Gruppen wie in iOS-Einstellungen */
.sect{margin:0 0 22px}
.sect>h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--sec);margin:0 16px 7px;letter-spacing:0;display:flex;justify-content:space-between}
.sect>.foot{font-size:13px;color:var(--sec);margin:7px 16px 0}
.group{border-radius:24px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:11px 16px;background:none;border:0;color:var(--text);font:inherit;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active{background:var(--fill)}
.cell .cl{flex:1;min-width:0}
.cell .cv{color:var(--sec);text-align:right;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cv.ph{color:var(--blue)}
.cell .chev{color:var(--ter);font-size:20px;margin-left:-4px}
.cell .two{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .two small{color:var(--sec);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.cell input,.cell select{background:none;border:0;color:var(--sec);font:inherit;text-align:right;min-width:0;padding:0;outline:none}
.cell input.left{text-align:left;color:var(--text);flex:1}
.cell textarea{flex:1;background:none;border:0;color:var(--text);font:inherit;resize:none;min-height:60px;outline:none;padding:0}
.cell.danger{color:var(--red);justify-content:center}
.cell.accent{color:var(--blue)}
.tnum{font-variant-numeric:tabular-nums}
.nr{font-weight:600}
.dim{color:var(--sec)}

/* Segment */
.seg{display:flex;padding:3px;border-radius:999px;margin-bottom:18px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:15px;font-weight:500;padding:8px 6px;border-radius:999px;opacity:.75}
.seg button.on{background:var(--glass-strong);opacity:1;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 1px 0 var(--hi)}

/* Knöpfe */
.cta{display:block;width:100%;border:0;border-radius:999px;padding:17px;font:inherit;font-size:18px;font-weight:600;color:#fff;margin:4px 0 26px;box-shadow:0 8px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.cta:active{transform:scale(.98)}
.cta.green{background:var(--green)} .cta.blue{background:var(--blue)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.circ{width:78px;height:78px;border-radius:50%;border:0;font:inherit;font-size:15px;font-weight:500;display:grid;place-items:center;
  box-shadow:inset 0 1px 0 var(--hi)}
.circ.gray{background:var(--fill);color:var(--text)}
.circ.red{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.circ.orange{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange)}
.circ.green{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.capsule{flex:1;margin:0 12px;height:78px;border-radius:999px;border:0;background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:600;
  box-shadow:0 8px 24px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,.35);padding:0 14px;line-height:1.2}
.capsule small{display:block;font-size:13px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn{background:none;border:0;color:var(--blue);font:inherit;padding:10px;display:block;margin:0 auto 22px}

/* Laufende Aufgabe */
.hero{border-radius:32px;padding:22px 20px 22px;margin-bottom:14px}
.hero .meta{font-size:15px;color:var(--sec);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 25%,transparent)}
.live.p{background:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 25%,transparent)}
.hero h3{font-size:26px;font-weight:700;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--text);margin:2px 4px 2px 0}
.clock{font-size:76px;font-weight:200;letter-spacing:-.02em;text-align:center;margin:18px 0 4px;font-variant-numeric:tabular-nums}
.prog{display:flex;gap:4px;margin:14px 0 6px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--fill)}
.prog i.d{background:var(--blue);opacity:.5} .prog i.c{background:var(--blue)}
.progtxt{font-size:13px;color:var(--sec);text-align:center}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-radius:24px;overflow:hidden;margin-bottom:22px}
.kpis div{padding:14px 12px;text-align:center}
.kpis div+div{border-left:.5px solid var(--sep)}
.kpis b{display:block;font-size:22px;font-weight:600;margin-top:2px}
.kpis span{font-size:12px;color:var(--sec)}
.period{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 16px}
.period b{font-size:15px;font-weight:600}

/* Sheets */
.layer{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s}
.layer.open{opacity:1;pointer-events:auto}
.layer.l2{z-index:40}
.sheet{width:100%;max-height:94vh;overflow:auto;border-radius:30px 30px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border-top:.5px solid var(--edge);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.layer.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:0 auto 6px}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:14px}
.shead b{font-size:17px;font-weight:600;text-align:center}
.shead button{background:none;border:0;font:inherit;color:var(--blue);padding:8px 0}
.shead button.r{text-align:right;font-weight:600}
.shead button.l{text-align:left}
.sheet .group{background:var(--glass)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:9px 12px;margin-bottom:16px}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;outline:none}
.check{color:var(--blue);font-weight:600}
.stepbox{border-radius:20px;overflow:hidden;margin-bottom:10px;background:var(--glass)}
.stephead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0;font-size:13px;color:var(--sec)}
.stephead .mini{display:flex;gap:4px}
.stephead .mini button{background:var(--fill);border:0;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:14px}
.stephead .mini button:disabled{opacity:.3}
.stephead .mini button.x{color:var(--red)}

/* Tab-Leiste */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;
  display:flex;gap:2px;padding:5px;border-radius:999px;width:min(calc(100% - 32px),420px)}
.tabbar button{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:999px;opacity:.7}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{opacity:1;color:var(--blue);background:var(--fill)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);z-index:60;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:500;
  transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
.empty{padding:22px 16px;text-align:center;color:var(--sec);font-size:15px}
.backbtn{background:none;border:0;color:var(--blue);font:inherit;padding:4px 0 12px;display:block}
.grow{flex:1;min-width:0}
.todaybtn{border:0;font:inherit;font-size:13px;font-weight:600;color:var(--blue);background:var(--fill);border-radius:999px;padding:4px 12px;margin-top:4px}
.pmid{display:flex;flex-direction:column;align-items:center}
.others{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.ochip{display:inline-flex;align-items:center;gap:7px;border:0;font:inherit;font-size:13px;font-weight:500;color:var(--text);background:var(--fill);border-radius:999px;padding:6px 12px;cursor:pointer}
.ochip .live{width:7px;height:7px;box-shadow:none}
.foldhead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:20px;font-weight:700;padding:4px 6px 10px;text-align:left}
.foldhead .dotc{width:10px;height:10px;border-radius:50%;flex:none}
.foldhead .cnt{font-size:15px;font-weight:500;color:var(--sec);background:var(--fill);border-radius:999px;padding:2px 10px}
.foldhead .chev{color:var(--ter);font-size:22px;font-weight:400;transition:transform .2s}
body.fs{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)} body.fs .tabbar{display:none}
.fsview{min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 26px);display:flex;flex-direction:column}
.pill-live{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sec)}
.fstop{text-align:center;margin-top:16px}
.fsprod{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.fsnr{font-size:15px;color:var(--sec);margin-top:4px}
.fstask{font-size:19px;font-weight:500;margin-top:14px}
.fsclock{font-size:84px;margin:24px 0 22px}
.fssteps{border-radius:22px;padding:4px 16px;margin-bottom:auto;max-height:38vh;overflow:auto}
.fsstep{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:16px;color:var(--sec)}
.fsstep+.fsstep{border-top:.5px solid var(--sep)}
.fsstep .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:13px;font-weight:600;flex:none}
.fsstep.c{color:var(--text);font-weight:600} .fsstep.c .n{background:var(--blue);color:#fff}
.fsstep.d .n{background:color-mix(in srgb,var(--green) 25%,transparent);color:var(--green)}
.fsbottom{padding-top:18px}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:19;width:min(calc(100% - 32px),420px);display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:20px;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.mini b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;font-size:13px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tnum{font-weight:600}
body.hasmini{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;transition:background .2s;flex:none;margin:0;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .2s}
.sw:checked{background:var(--green)} .sw:checked::after{left:22px}
.hidden{display:none!important}
</style>
</head>

<main id="view"></main>

<nav class="tabbar glass">
  <button data-tab="stopp" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.2 1.6M10 2.5h4M12 2.5V6M18.5 6.5l1.2-1.2"/></svg>Stempeln</button>

  <button data-tab="einst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Verwalten</button>
</nav>

<div class="layer" id="L1"><div class="sheet" id="S1"></div></div>
<div class="layer l2" id="L2"><div class="sheet" id="S2"></div></div>
<div id="toast" class="toast glass"></div>

<script>

/* =========================================================
   Datenmodell
   stamm:  { auftraege:[{id,nr,produkt,done}], taet:[{id,name}], masch:[{id,name}],
             ablaeufe:[{id,name,steps:[{t,m}]}], last:{a,t,m,ab} }
   aktiv:  null | { day, eid, ab:{id,name,steps,idx} }
   days:   { 'YYYY-MM-DD': { <eid>: { id, a:{nr,produkt}, t, m, s, e, p:[[s,e]], ab:{n,i,of}, note } } }
   ========================================================= */
const LS_KEY = 'zeitstempel-v2';
const STAMM0 = () => ({ auftraege:[], taet:[], masch:[], ablaeufe:[], last:{} });
let state = { stamm: STAMM0(), aktiv: null, days: {} };

function loadLocal(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.days) state = s; }catch(e){}
  state.stamm = Object.assign(STAMM0(), state.stamm||{});
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- Cloud-Speicher ---------- */
let col = null, syncStatus = 'nur auf diesem Gerät';
const writing = {}, dirty = {};
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const clone = o => JSON.parse(JSON.stringify(o));

function bodyFor(id){
  if(id==='stamm') return state.stamm;
  if(id==='aktiv') return { v: state.aktiv };
  return { items: state.days[id.slice(2)] || {} };
}
function applyDoc(id, data){
  if(id==='stamm') state.stamm = Object.assign(STAMM0(), clone(data));
  else if(id==='aktiv') state.aktiv = data.v ? clone(data.v) : null;
  else if(id.startsWith('d-')) state.days[id.slice(2)] = clone(data.items||{});
}

async function initCloud(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    col = db.collection('data/users/' + uid);
    syncStatus = 'verbinde…'; renderSyncInfo();
    let first = true;
    const timer = setTimeout(()=>{ if(first){ syncStatus = 'Cloud nicht erreichbar – speichert auf dem Gerät'; renderSyncInfo(); } }, 10000);
    col.onSnapshot(snap => {
      if(snap.metadata.fromCache && first) return;
      if(first){
        first = false; clearTimeout(timer);
        if(snap.empty){
          // Erstes Mal: vorhandene Gerätedaten hochladen
          persist('stamm'); persist('aktiv'); Object.keys(state.days).forEach(d => persist('d-'+d));
          syncStatus = 'synchronisiert'; renderSyncInfo(); return;
        }
      }
      let changed = false;
      snap.docs.forEach(d => { if(writing[d.id] || dirty[d.id]) return; const data = d.data(); if(!data) return; applyDoc(d.id, data); changed = true; });
      syncStatus = 'synchronisiert';
      if(changed){ saveLocal(); if(!sheetOpen()) render(); }
      renderSyncInfo();
    }, () => { clearTimeout(timer); syncStatus = 'Cloud getrennt – speichert auf dem Gerät'; renderSyncInfo(); });
  }catch(e){}
}
function persist(docId){
  saveLocal();
  if(!col) return;
  dirty[docId] = true;
  if(!writing[docId]) flush(docId);
}
async function flush(id){
  writing[id] = true; let retried = false;
  while(dirty[id]){
    dirty[id] = false;
    try{ await col.doc(id).set(clone(bodyFor(id))); syncStatus = 'synchronisiert'; }
    catch(e){
      if(e && e.code==='unavailable' && !retried){ retried = true; dirty[id] = true; await sleep(600+Math.random()*900); continue; }
      syncStatus = 'Fehler beim Speichern in der Cloud – auf dem Gerät gesichert';
    }
  }
  writing[id] = false; renderSyncInfo();
}
function renderSyncInfo(){ const el = document.getElementById('sync'); if(el) el.textContent = syncStatus; }

/* ---------- Helfer ---------- */
const WT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const pad = n => String(n).padStart(2,'0');
const dayKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDay = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const hm = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const dstr = k => { const d = parseDay(k); return WT[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear(); };
function dur(ms, sec){ ms = Math.max(0, ms); const t = Math.floor(ms/1000); return Math.floor(t/3600)+':'+pad(Math.floor(t%3600/60))+(sec?':'+pad(t%60):''); }
const dec = ms => (Math.max(0,ms)/3600000).toFixed(2).replace('.',',') + ' h';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const aKey = a => (a && a.nr || '') + '|' + (a && a.produkt || '');
const aLabel = a => a ? ('#' + a.nr + (a.produkt ? ' · ' + a.produkt : '')) : '–';

function entryDur(e, now){
  const end = e.e || now;
  let p = 0; (e.p||[]).forEach(([ps,pe]) => { p += (pe || end) - ps; });
  return { work: Math.max(0, end - e.s - p), pause: p };
}
function isPaused(e){ const p = e.p||[]; return p.length && !p[p.length-1][1]; }

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2000); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate(20); }catch(e){} }

/* ---------- Stammdaten ---------- */
function ensureName(listName, name){
  name = (name||'').trim(); if(!name) return '';
  const L = state.stamm[listName];
  const f = L.find(x => x.name.toLowerCase() === name.toLowerCase());
  if(f) return f.name;
  L.push({ id: uid(), name }); persist('stamm'); return name;
}
function ensureAuftrag(nr, produkt){
  nr = (nr||'').trim(); produkt = (produkt||'').trim(); if(!nr) return null;
  const L = state.stamm.auftraege;
  let f = L.find(x => x.nr === nr && x.produkt === produkt);
  if(!f){ f = { id: uid(), nr, produkt, done:false }; L.push(f); persist('stamm'); }
  return f;
}


/* ---------- Zeiterfassung ---------- */
// Mehrere Aufgaben können gleichzeitig laufen: state.aktiv = [{ day, eid, ab }]
function runs(){
  let a = state.aktiv;
  if(!a) a = []; else if(!Array.isArray(a)) a = [a];
  a = a.filter(r => r && state.days[r.day] && state.days[r.day][r.eid] && !state.days[r.day][r.eid].e);
  state.aktiv = a; return a;
}
function runEntry(r){ return r && state.days[r.day] && state.days[r.day][r.eid] || null; }
function findRun(eid){ return eid ? runs().find(r => r.eid===eid) || null : null; }
function curEntry(){ return runEntry(runs()[0]); }
function stopRun(r, now){
  const e = runEntry(r);
  if(e){ if(isPaused(e)) e.p[e.p.length-1][1] = now; e.e = now; persist('d-'+r.day); }
  state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv');
}
function startEntry(auftrag, t, m, ab, now){
  const day = dayKey(new Date(now));
  const e = { id: uid(), a:{ nr:auftrag.nr, produkt:auftrag.produkt }, t, m: m||'', s: now, e: null, p: [], note:'' };
  if(ab) e.ab = { n: ab.name, i: ab.idx, of: ab.steps.length };
  state.days[day] = state.days[day] || {};
  state.days[day][e.id] = e; persist('d-'+day);
  const r = { day, eid: e.id, ab: ab || null };
  state.aktiv = runs().concat([r]); persist('aktiv');
  return r;
}
function togglePause(r){
  const e = runEntry(r); if(!e) return;
  const now = Date.now();
  if(isPaused(e)) e.p[e.p.length-1][1] = now; else e.p.push([now, null]);
  persist('d-'+r.day); buzz(); render();
}
// Zeitabschnitte eines Eintrags ohne Pausen
function segs(e, now){
  const end = e.e || now, out = []; let cur = e.s;
  (e.p||[]).slice().sort((x,y) => x[0]-y[0]).forEach(([ps,pe]) => { pe = pe || end; if(ps > cur) out.push([cur, Math.min(ps, end)]); cur = Math.max(cur, pe); });
  if(end > cur) out.push([cur, end]);
  return out;
}
// tatsächlich gearbeitete Zeit: gleichzeitige Aufträge zählen nur einmal
function unionTime(list){
  list.sort((x,y) => x[0]-y[0]); let tot = 0, cs = null, ce = null;
  list.forEach(([s,e]) => { if(cs===null || s > ce){ if(cs!==null) tot += ce-cs; cs = s; ce = e; } else ce = Math.max(ce, e); });
  if(cs!==null) tot += ce-cs; return tot;
}

/* ---------- Auswertung ---------- */
function summarize(dayKeys, now){
  const per = {}; const masch = {}; const all = [];
  dayKeys.forEach(k => {
    const d = state.days[k]; if(!d) return;
    Object.values(d).forEach(e => {
      const w = entryDur(e, now).work;
      segs(e, now).forEach(s => all.push(s));
      const key = aKey(e.a);
      const g = per[key] = per[key] || { a:e.a, own:0, masch:{}, taet:{}, n:0 };
      g.own += w; g.n++;
      g.taet[e.t] = (g.taet[e.t]||0) + w;
      if(e.m){ g.masch[e.m] = (g.masch[e.m]||0) + w; masch[e.m] = (masch[e.m]||0) + w; }
    });
  });
  return { own: unionTime(all), masch, per: Object.values(per).sort((x,y)=>y.own-x.own) };
}
function rangeKeys(mode, off){
  const today = new Date(); today.setHours(0,0,0,0);
  let start, end, label;
  if(mode==='tag'){ start = new Date(today); start.setDate(start.getDate()+off); end = new Date(start); label = dstr(dayKey(start)); }
  else if(mode==='woche'){
    start = new Date(today); start.setDate(start.getDate()-((start.getDay()+6)%7)+off*7); end = new Date(start); end.setDate(end.getDate()+6);
    label = 'KW ' + kw(start) + ' · ' + start.getDate()+'.'+(start.getMonth()+1)+'. – '+end.getDate()+'.'+(end.getMonth()+1)+'.';
  } else {
    start = new Date(today.getFullYear(), today.getMonth()+off, 1); end = new Date(start.getFullYear(), start.getMonth()+1, 0);
    label = MONATE[start.getMonth()] + ' ' + start.getFullYear();
  }
  const keys = []; for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) keys.push(dayKey(d));
  return { keys, label, fname: mode==='monat' ? MONATE[start.getMonth()]+'_'+start.getFullYear() : dayKey(start) };
}
function kw(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/86400000+1)/7); }

function csv(rows){ return '﻿' + rows.map(r => r.map(c => { c = String(c==null?'':c); return /[;"\n\r]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(';')).join('\r\n'); }
const decN = ms => (Math.max(0,ms)/3600000).toFixed(2).replace('.',',');
function csvAuftraege(keys){
  const s = summarize(keys, Date.now());
  const rows = [['Auftrags-Nr.','Produkt','Art','Bezeichnung','Zeit (h:mm)','Zeit (Std. dezimal)','Minuten']];
  s.per.forEach(g => {
    rows.push([g.a.nr, g.a.produkt, 'Arbeitszeit gesamt', '', dur(g.own), decN(g.own), Math.round(g.own/60000)]);
    Object.entries(g.masch).forEach(([m,v]) => rows.push([g.a.nr, g.a.produkt, 'Maschinenzeit', m, dur(v), decN(v), Math.round(v/60000)]));
    Object.entries(g.taet).forEach(([t,v]) => rows.push([g.a.nr, g.a.produkt, 'Tätigkeit', t, dur(v), decN(v), Math.round(v/60000)]));
  });
  return csv(rows);
}
function csvBuchungen(keys){
  const now = Date.now();
  const rows = [['Datum','Start','Ende','Auftrags-Nr.','Produkt','Arbeitsablauf','Schritt','Tätigkeit','Maschine','Pause (min)','Dauer (h:mm)','Dauer (Std. dezimal)','Notiz']];
  keys.forEach(k => Object.values(state.days[k]||{}).sort((a,b)=>a.s-b.s).forEach(e => {
    const d = entryDur(e, now);
    rows.push([parseDay(k).toLocaleDateString('de-DE'), hm(e.s), e.e?hm(e.e):'läuft', e.a.nr, e.a.produkt, e.ab?e.ab.n:'', e.ab?(e.ab.i+1)+'/'+e.ab.of:'',
      e.t, e.m, Math.round(d.pause/60000), dur(d.work), decN(d.work), (e.note||'').replace(/\s+/g,' ')]);
  }));
  return csv(rows);
}

function pick(kind, cur, opt){
  opt = opt || {};
  return new Promise(res => {
    let q = '', finished = false;
    const finish = v => { if(finished) return; finished = true; closeSheet(2); res(v); };
    const titles = { auftrag:'Auftrag', taet:'Tätigkeit', masch:'Maschine', ab:'Arbeitsablauf' };
    const body = openSheet(2, { title: titles[kind], onLeft: () => finish(undefined) });
    body.innerHTML = `<div class="search">${ICON_SEARCH}<input id="pq" placeholder="${kind==='ab'?'Suchen':'Suchen oder neu eingeben'}" autocomplete="off"></div><div id="plist"></div>`;
    const items = () => kind==='auftrag'
      ? state.stamm.auftraege.filter(a => !a.done || a.id===cur).map(a => ({ v:a.id, l:'#'+a.nr, s:a.produkt, k:(a.nr+' '+a.produkt).toLowerCase(), nr:true }))
      : kind==='ab' ? state.stamm.ablaeufe.map(a => ({ v:a.id, l:a.name, s:a.steps.map(x=>x.t).join(' → '), k:a.name.toLowerCase() }))
      : state.stamm[kind].map(x => ({ v:x.name, l:x.name, k:x.name.toLowerCase() }));
    const row = (v, l, s, on, nr) => `<button class="cell" data-v="${esc(v)}"><span class="cl two"><span class="${nr?'nr':''}">${esc(l)}</span>${s?`<small>${esc(s)}</small>`:''}</span>${on?'<span class="check">✓</span>':''}</button>`;
    const plist = body.querySelector('#plist');
    const draw = () => {
      const ql = q.trim().toLowerCase();
      const all = items(), list = all.filter(i => !ql || i.k.includes(ql));
      let h = '';
      if(opt.none && !ql) h += `<div class="sect"><div class="group">${row('', opt.none, '', !cur)}</div></div>`;
      if(list.length) h += `<div class="sect"><div class="group">${list.map(i => row(i.v, i.l, i.s, i.v===cur, i.nr)).join('')}</div></div>`;
      else if(!ql) h += `<div class="empty">${kind==='ab' ? 'Noch keine Arbeitsabläufe – lege sie unter „Verwalten“ an.' : 'Noch keine Einträge – tippe oben etwas ein.'}</div>`;
      const exact = all.some(i => kind==='auftrag' ? i.l.toLowerCase()==='#'+ql : i.k===ql);
      if(kind!=='ab' && ql && !exact) h += `<div class="group"><button class="cell accent" data-add>＋ „${esc(q.trim())}“ hinzufügen</button></div>`;
      plist.innerHTML = h;
      plist.querySelectorAll('[data-v]').forEach(b => b.onclick = () => finish(b.dataset.v));
      const add = plist.querySelector('[data-add]');
      if(add) add.onclick = () => kind==='auftrag' ? addAuftrag(q.trim()) : finish(ensureName(kind, q));
    };
    const addAuftrag = nr => {
      plist.innerHTML = `<div class="sect"><h2>Neuer Auftrag</h2><div class="group">
        <label class="cell"><span>Auftrags-Nr.</span><input id="na-nr" value="${esc(nr)}" style="flex:1"></label>
        <label class="cell"><span>Produkt</span><input id="na-pr" placeholder="Produktname" style="flex:1"></label></div></div>
        <button class="cta blue" id="na-ok">Hinzufügen</button>`;
      document.getElementById('na-pr').focus();
      document.getElementById('na-ok').onclick = () => {
        const a = ensureAuftrag(document.getElementById('na-nr').value, document.getElementById('na-pr').value);
        if(!a) return toast('Auftrags-Nr. fehlt');
        finish(a.id);
      };
    };
    body.querySelector('#pq').oninput = ev => { q = ev.target.value; draw(); };
    draw();
  });
}

/* ---------- Starten / Stoppen ---------- */
let fsMin = false; // Vollbild minimiert?
const aFind = x => x && state.stamm.auftraege.find(a => a.nr===x.nr && a.produkt===x.produkt);

let fsRun = null; // welche laufende Aufgabe im Vollbild gezeigt wird
// Aufgabe anhalten und Position am Auftrag merken
function suspendRun(r, now){
  const e = runEntry(r), A = e ? aFind(e.a) : null;
  if(A){ A.resume = r.ab ? { ab: clone(r.ab) } : { t:e.t, m:e.m||'' }; A.resumeAt = now; persist('stamm'); }
  stopRun(r, now);
}
function runsOf(A){ return runs().filter(r => { const e = runEntry(r); return e && aFind(e.a) === A; }); }
function stopRunsOf(A, now){ runsOf(A).forEach(r => stopRun(r, now)); }
function afterRunEnd(){ fsRun = null; fsMin = runs().length > 0; }
function reactivate(A){ if(A && A.done){ A.done = false; delete A.doneAt; persist('stamm'); } }
function clearResume(A){ if(A && A.resume){ delete A.resume; delete A.resumeAt; persist('stamm'); } }

function startTaskFor(A, t, m){
  if(!t){ toast('Bitte Tätigkeit wählen'); return false; }
  const now = Date.now(); stopRunsOf(A, now); clearResume(A); reactivate(A);
  fsRun = startEntry(A, t, m, null, now).eid;
  state.stamm.last = Object.assign(state.stamm.last||{}, { a:A.id, t, m:m||'' }); persist('stamm');
  fsMin = false; buzz(); toast('▶︎ ' + t); return true;
}
function startAblaufFor(A, def, fromIdx){
  if(!def.steps.length){ toast('Arbeitsablauf hat keine Schritte'); return false; }
  const now = Date.now(); stopRunsOf(A, now); clearResume(A); reactivate(A);
  const ab = { id:def.id, name:def.name, steps:clone(def.steps), idx: fromIdx||0, a:{ nr:A.nr, produkt:A.produkt } };
  fsRun = startEntry(A, ab.steps[ab.idx].t, ab.steps[ab.idx].m, ab, now).eid;
  state.stamm.last = Object.assign(state.stamm.last||{}, { a:A.id, ab:def.id }); persist('stamm');
  fsMin = false; buzz(); toast(fromIdx ? '▶︎ Fortgesetzt bei Schritt ' + (fromIdx+1) : '▶︎ ' + def.name); return true;
}
function resumeFor(A){
  const r = A.resume; if(!r) return false;
  if(r.ab) return startAblaufFor(A, r.ab, r.ab.idx);
  return startTaskFor(A, r.t, r.m);
}
function nextStep(r){
  if(!r || !r.ab) return;
  const now = Date.now(), ab = clone(r.ab);
  stopRun(r, now);
  ab.idx++;
  if(ab.idx >= ab.steps.length){ const A = aFind(ab.a); clearResume(A); afterRunEnd(); buzz(); render(); doneAsk(A, 'Arbeitsablauf abgeschlossen'); return; }
  fsRun = startEntry(ab.a, ab.steps[ab.idx].t, ab.steps[ab.idx].m, ab, now).eid;
  buzz(); toast('Weiter: ' + ab.steps[ab.idx].t); render();
}
function skipStep(r){
  if(!r || !r.ab) return;
  const now = Date.now(), ab = clone(r.ab);
  if(state.days[r.day]) delete state.days[r.day][r.eid];
  persist('d-'+r.day);
  state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv');
  ab.idx++;
  if(ab.idx >= ab.steps.length){ const A = aFind(ab.a); clearResume(A); afterRunEnd(); buzz(); render(); doneAsk(A, 'Letzter Schritt übersprungen'); return; }
  fsRun = startEntry(ab.a, ab.steps[ab.idx].t, ab.steps[ab.idx].m, ab, now).eid;
  buzz(); toast('Übersprungen → ' + ab.steps[ab.idx].t); render();
}
function markDone(A){
  if(!A) return;
  A.done = true; A.doneAt = Date.now(); delete A.resume; delete A.resumeAt; persist('stamm');
  buzz(); toast('✓ ' + (A.produkt || '#'+A.nr) + ' fertig gemeldet');
}

function doneAsk(A, title){
  if(!A){ toast(title); return; }
  const body = openSheet(1, { title, left:'Später' });

function auftragSheet(A){
  const body = openSheet(1, { title: A.produkt || ('#' + A.nr) });
  const last = state.stamm.last || {};
  const back = () => `<button class="backbtn" data-back>‹ Zurück</button>`;
  const bindBack = fn => { const b = body.querySelector('[data-back]'); if(b) b.onclick = fn; };

  const home = () => {
    body.innerHTML = `<div class="subttl" style="text-align:center;margin-top:-8px">Auftrag #${esc(A.nr)}${A.done ? ` · <span style="color:var(--green)">✓ fertig${A.doneAt ? ' am ' + new Date(A.doneAt).toLocaleDateString('de-DE') : ''}</span>` : ''}</div>
      ${A.resume ? `<div class="sect"><h2><span>Unterbrochen</span></h2><div class="group">
        <button class="cell" data-c="resume"><span class="icon" style="background:var(--orange)">▶︎</span><span class="cl two"><span style="font-weight:600">Fortsetzen</span><small>${esc(resumeText(A.resume))}</small></span><span class="chev">›</span></button></div></div>` : ''}
      <div class="sect">${A.resume || A.done ? `<h2><span>${A.done ? 'Weiterarbeiten' : 'Neu starten'}</span></h2>` : ''}<div class="group">
        <button class="cell" data-c="task"><span class="icon" style="background:var(--green)">▶︎</span><span class="cl two"><span>Einzelne Aufgabe</span><small>Tätigkeit und Maschine frei wählen</small></span><span class="chev">›</span></button>
        <button class="cell" data-c="ab"><span class="icon" style="background:var(--indigo)">▤</span><span class="cl two"><span>Arbeitsablauf</span><small>Feste Schritte – du tippst nur noch weiter</small></span><span class="chev">›</span></button>
      </div></div>
      ${A.done ? `<div class="group"><button class="cell accent" data-c="reopen" style="justify-content:center">Wieder auf „Aktiv“ setzen</button></div>` : `<div class="group"><button class="cell" data-c="done" style="justify-content:center;color:var(--green)">✓ Auftrag fertig melden</button></div>`}`;
    const r = body.querySelector('[data-c=resume]'); if(r) r.onclick = () => { if(resumeFor(A)) closeSheet(1); };
    body.querySelector('[data-c=task]').onclick = task;
    body.querySelector('[data-c=ab]').onclick = abList;
    const ro = body.querySelector('[data-c=reopen]');
    if(ro) ro.onclick = () => { reactivate(A); closeSheet(1); toast('Wieder aktiv'); };
    let armed = false;
    const d = body.querySelector('[data-c=done]');
    if(d) d.onclick = () => {
      if(!armed){ armed = true; d.textContent = 'Nochmal tippen zum Bestätigen'; return; }
      stopRunsOf(A, Date.now()); markDone(A); afterRunEnd(); closeSheet(1);
    };
  };

  const f = { t: last.t || '', m: last.m || '' };
  const task = () => {
    body.innerHTML = `${back()}<div class="sect"><h2><span>Einzelne Aufgabe</span></h2><div class="group">
        ${pickCell('t','Tätigkeit',esc(f.t),'Wählen')}${pickCell('m','Maschine',esc(f.m),'Ohne')}</div></div>
      <button class="cta green" id="go">${runsOf(A).length ? 'Wechseln & starten' : 'Starten'}</button>`;
    bindBack(home);
    body.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => {
      const k = b.dataset.pk;
      const v = await pick(k==='t' ? 'taet' : 'masch', f[k], k==='m' ? { none:'Ohne Maschine' } : {});
      if(v !== undefined){ f[k] = v; task(); }
    });
    body.querySelector('#go').onclick = () => { if(startTaskFor(A, f.t, f.m)) closeSheet(1); };
  };

  let q = '';
  const abList = () => {
    body.innerHTML = `${back()}<div class="search">${ICON_SEARCH}<input id="abq" placeholder="Arbeitsablauf suchen" autocomplete="off" value="${esc(q)}"></div><div id="ablist"></div>`;
    bindBack(home);
    const draw = () => {
      const ql = q.trim().toLowerCase(), all = state.stamm.ablaeufe;
      const list = all.filter(x => !ql || (x.name + ' ' + x.steps.map(s => s.t + ' ' + s.m).join(' ')).toLowerCase().includes(ql))
        .sort((x,y) => (y.id===last.ab) - (x.id===last.ab) || x.name.localeCompare(y.name, 'de'));
      const el = body.querySelector('#ablist');
      el.innerHTML = (list.length
        ? `<div class="sect"><div class="group">${list.map(x => `<button class="cell" data-ab="${x.id}"><span class="icon" style="background:var(--indigo)">${x.steps.length}</span><span class="cl two"><span>${esc(x.name)}</span><small>${x.steps.map(s => esc(s.t)).join(' → ')}</small></span><span class="chev">›</span></button>`).join('')}</div></div>`
        : `<div class="sect"><div class="group"><div class="empty">${all.length ? 'Kein Arbeitsablauf gefunden.' : 'Noch keine Arbeitsabläufe angelegt.'}</div></div></div>`)
        + `<div class="group"><button class="cell accent" id="abnew" style="justify-content:center">＋ Neuer Arbeitsablauf</button></div>`;
      el.querySelectorAll('[data-ab]').forEach(b => b.onclick = () => abDetail(all.find(x => x.id===b.dataset.ab)));
      el.querySelector('#abnew').onclick = () => editAblauf(null);
    };
    body.querySelector('#abq').oninput = ev => { q = ev.target.value; draw(); };
    draw();
  };

  const abDetail = def => {
    body.innerHTML = `${back()}<div class="ttl" style="font-size:26px;margin:4px 4px 2px">${esc(def.name)}</div>
      <div class="subttl">${def.steps.length} Schritte für ${esc(A.produkt||'')} · #${esc(A.nr)}</div>
      <div class="sect"><div class="group">${def.steps.map((s,i) => `<div class="cell"><span class="icon" style="background:var(--indigo)">${i+1}</span><span class="cl two"><span>${esc(s.t)}</span>${s.m?`<small>⚙︎ ${esc(s.m)}</small>`:''}</span></div>`).join('')}</div></div>
      <button class="cta green" id="go">${runsOf(A).length ? 'Wechseln & starten' : 'Arbeitsablauf starten'}</button>`;
    bindBack(abList);
    body.querySelector('#go').onclick = () => { if(startAblaufFor(A, def)) closeSheet(1); };
  };

  home();
}

function newAuftragSheet(prefill){
  const body = openSheet(1, { title:'Neuer Auftrag', right:'Sichern', onRight: save });
  const digits = /^[\d\s\-\/.]+$/.test(prefill || '');
  body.innerHTML = `<div class="sect"><div class="group">
      <label class="cell"><span>Auftrags-Nr.</span><input id="na-nr" value="${esc(digits ? prefill : '')}" style="flex:1"></label>
      <label class="cell"><span>Produkt</span><input id="na-pr" value="${esc(digits ? '' : prefill || '')}" placeholder="Produktname" style="flex:1"></label></div></div>`;
  function save(){
    const A = ensureAuftrag(document.getElementById('na-nr').value, document.getElementById('na-pr').value);
    if(!A) return toast('Auftrags-Nr. fehlt');
    if(A.done){ A.done = false; persist('stamm'); }
    aQuery = ''; stOpen.aktiv = true;
    closeSheet(1); toast('Auftrag ' + (A.produkt || '#'+A.nr) + ' angelegt');
  }
}

/* ---------- Vollbild: laufende Aufgabe ---------- */
function renderRunning(r){
  const e = runEntry(r), now = Date.now(), paused = isPaused(e), ab = r.ab;
  const others = runs().filter(x => x.eid !== r.eid);
  document.body.classList.add('fs');
  view.innerHTML = `<div class="fsview">
    <div class="nav"><button id="fmin" aria-label="Zur Übersicht" style="background:none;border:0;color:var(--text);width:44px;height:44px;display:grid;place-items:center;margin-left:-10px;padding:0"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pill-live"><span class="live ${paused?'p':''}"></span>${paused?'Pausiert':'Läuft seit '+hm(e.s)}</span><span style="width:44px"></span></div>
    ${others.length ? `<div class="others">${others.map(o => { const oe = runEntry(o); return `<button class="ochip" data-sw="${o.eid}"><span class="live ${isPaused(oe)?'p':''}"></span>${esc(oe.a.produkt || '#'+oe.a.nr)} <span class="tnum dim" data-live="${o.eid}">${dur(entryDur(oe, now).work, true)}</span></button>`; }).join('')}</div>` : ''}
    <div class="fstop">
      <div class="fsprod">${esc(e.a.produkt || '#'+e.a.nr)}</div>
      ${e.a.produkt ? `<div class="fsnr">Auftrag #${esc(e.a.nr)}</div>` : ''}
      <div class="fstask">${esc(e.t)}${e.m ? `<span class="chip" style="margin-left:8px;vertical-align:middle">⚙︎ ${esc(e.m)}</span>` : ''}</div>
    </div>
    <div class="clock fsclock" id="clock">${dur(entryDur(e, now).work, true)}</div>
    ${ab ? `<div class="fssteps glass">${ab.steps.map((s,i) => `<div class="fsstep ${i<ab.idx?'d':i===ab.idx?'c':''}"><span class="n">${i<ab.idx?'✓':i+1}</span><span class="grow">${esc(s.t)}${s.m?` <span class="dim">· ${esc(s.m)}</span>`:''}</span></div>`).join('')}</div>` : '<div style="flex:1"></div>'}
    <div class="fsbottom">
      <div class="ctl">
        <button class="circ ${paused?'green':'orange'}" id="bp">${paused?'Start':'Pause'}</button>
        ${ab ? `<button class="capsule" id="bn">${ab.idx < ab.steps.length-1 ? `Nächster Schritt<small>${esc(ab.steps[ab.idx+1].t)}</small>` : 'Abschließen ✓'}</button>` : '<span></span>'}
        <button class="circ red" id="bs">Stopp</button>
      </div>
      ${ab ? `<button class="linkbtn" id="bskip" style="margin:14px auto 0;padding:6px">Schritt überspringen</button>` : ''}
    </div></div>`;
  document.getElementById('fmin').onclick = () => { fsMin = true; render(); };
  document.getElementById('bp').onclick = () => togglePause(r);
  document.getElementById('bs').onclick = () => stopSheet(r);
  const bn = document.getElementById('bn'); if(bn) bn.onclick = () => nextStep(r);
  view.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { fsRun = b.dataset.sw; render(); });
  const sk = document.getElementById('bskip');
  if(sk){
    let armed = false, t;
    sk.onclick = () => {
      if(!armed){ armed = true; sk.textContent = 'Nochmal tippen – Zeit dieses Schritts wird gelöscht'; sk.style.color = 'var(--red)';
        t = setTimeout(() => { armed = false; if(sk.isConnected){ sk.textContent = 'Schritt überspringen'; sk.style.color = ''; } }, 3500); return; }
      clearTimeout(t); skipStep(r);
    };
  }
}
// kleine Leiste über der Tab-Leiste, wenn das Vollbild verkleinert ist
function renderMini(){
  let m = document.getElementById('mini');
  const rs = runs();
  if(!rs.length || document.body.classList.contains('fs')){ if(m) m.remove(); document.body.classList.remove('hasmini'); return; }
  if(!m){ m = document.createElement('button'); m.id = 'mini'; m.className = 'mini glass'; document.body.appendChild(m); }
  document.body.classList.add('hasmini');
  if(rs.length === 1){
    const e = runEntry(rs[0]), paused = isPaused(e);
    m.innerHTML = `<span class="live ${paused?'p':''}"></span><span class="grow" style="min-width:0;text-align:left"><b>${esc(e.t)}</b><small>${esc(e.a.produkt || '')} · #${esc(e.a.nr)}</small></span><span class="tnum" data-live="${rs[0].eid}">${dur(entryDur(e, Date.now()).work, true)}</span>`;
    m.onclick = () => { fsRun = rs[0].eid; fsMin = false; tab = 'stopp'; render(); window.scrollTo(0,0); };
  } else {
    m.innerHTML = `<span class="live"></span><span class="grow" style="min-width:0;text-align:left"><b>${rs.length} Aufträge laufen</b><small>${rs.map(r => esc(runEntry(r).a.produkt || '#'+runEntry(r).a.nr)).join(' · ')}</small></span><span class="chev" style="color:var(--ter);font-size:22px">›</span>`;
    m.onclick = () => { fsMin = true; tab = 'stopp'; render(); window.scrollTo(0,0); };
  }
}

/* ---------- Tab: Stempeln ---------- */
let aQuery = '', stOpen = { aktiv:true, gestoppt:true, fertig:false };
function lastUse(){
  const m = {};
  for(const d in state.days) for(const e of Object.values(state.days[d])){ const k = aKey(e.a); if(!m[k] || e.s > m[k]) m[k] = e.s; }
  return m;
}
function agoText(ts){
  if(!ts) return '';
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const days = Math.round((d0 - new Date(ts).setHours(0,0,0,0)) / 86400000);
  return days <= 0 ? 'heute' : days === 1 ? 'gestern' : 'vor ' + days + ' Tagen';
}
function renderStopp(){
  const rs = runs();
  if(!fsMin && rs.length){
    const r = findRun(fsRun) || (rs.length === 1 ? rs[0] : null);
    if(r){ fsRun = r.eid; return renderRunning(r); }
  }
  const d0 = new Date();
  view.innerHTML = `<div class="nav"><span></span><button class="round glass" id="addA" aria-label="Neuer Auftrag">＋</button></div><div class="ttl">Stempeln</div><div class="subttl">${WT_LONG[d0.getDay()]}, ${d0.getDate()}. ${MONATE[d0.getMonth()]}</div>
    <div class="sect">
    <div class="search glass" style="border-radius:14px">${ICON_SEARCH}<input id="aq" placeholder="Produkt oder Auftrags-Nr. suchen" autocomplete="off" value="${esc(aQuery)}"></div>
    <div id="alist"></div></div>`;
  document.getElementById('aq').oninput = ev => { aQuery = ev.target.value; drawAList(); };
  document.getElementById('addA').onclick = () => newAuftragSheet(aQuery.trim());
  drawAList();
}
function drawAList(){
  const el = document.getElementById('alist'); if(!el) return;
  const lu = lastUse(), ql = aQuery.trim().toLowerCase();
  const runBy = {}; runs().forEach(r => { runBy[aKey(runEntry(r).a)] = r; });
  const match = a => !ql || (a.nr + ' ' + a.produkt).toLowerCase().includes(ql);
  const byUse = (x,y) => (lu[aKey(y)]||0) - (lu[aKey(x)]||0) || x.nr.localeCompare(y.nr, 'de', { numeric:true });
  const all = state.stamm.auftraege.filter(match);
  const isRun = a => !!runBy[aKey(a)];
  const fresh = all.filter(a => !a.done && !a.resume && !isRun(a) && !lu[aKey(a)]).sort((x,y) => x.nr.localeCompare(y.nr, 'de', { numeric:true }));
  const groups = [
    { k:'aktiv', t:'Aktiv', c:'var(--blue)', list: all.filter(a => !a.done && (!a.resume || isRun(a)) && (isRun(a) || lu[aKey(a)])).sort((x,y) => isRun(y) - isRun(x) || byUse(x,y)), empty:'Keine aktiven Aufträge.' },
    { k:'gestoppt', t:'Gestoppt', c:'var(--orange)', list: all.filter(a => !a.done && a.resume && !isRun(a)).sort((x,y) => (y.resumeAt||0) - (x.resumeAt||0)), empty:'Keine gestoppten Aufträge.' },
    { k:'fertig', t:'Fertig', c:'var(--green)', list: all.filter(a => a.done).sort((x,y) => (y.doneAt||0) - (x.doneAt||0)), empty:'Noch nichts fertig gemeldet.' },
  ];
  const cell = a => {
    const run = isRun(a);
    const icon = a.done ? ['var(--green)','✓'] : run ? ['var(--green)','▶︎'] : a.resume ? ['var(--orange)','❚❚'] : ['var(--blue)','#'];
    const sub = (a.produkt ? '#'+esc(a.nr) : '') + (a.resume && !run && !a.done && a.resume.ab ? ` · Schritt ${a.resume.ab.idx+1}/${a.resume.ab.steps.length}: ${esc(a.resume.ab.steps[a.resume.ab.idx].t)}` : a.resume && !run && !a.done ? ` · ${esc(a.resume.t)}` : '');
    const right = a.done ? (a.doneAt ? agoText(a.doneAt) : '') : run ? `<span style="color:var(--green)" class="tnum" data-live="${runBy[aKey(a)].eid}">${dur(entryDur(runEntry(runBy[aKey(a)]), Date.now()).work, true)}</span>` : agoText(a.resume ? a.resumeAt : lu[aKey(a)]);
    return `<button class="cell" data-auf="${a.id}"><span class="icon" style="background:${icon[0]}">${icon[1]}</span>
      <span class="cl two"><span style="font-weight:600">${esc(a.produkt || '#'+a.nr)}</span><small>${sub}</small></span>
      <span class="cv" style="font-size:14px">${right}</span><span class="chev">›</span></button>`;
  };
  let h = '';
  if(fresh.length) h += `<div class="sect" style="margin-bottom:26px"><div class="group glass">${fresh.map(cell).join('')}</div></div>`;
  if(ql && !all.length) h += `<div class="group glass" style="margin-bottom:26px"><button class="cell accent" id="anew" style="justify-content:center">＋ „${esc(aQuery.trim())}“ als neuen Auftrag anlegen</button></div>`;
  groups.forEach(g => {
    const open = ql ? g.list.length > 0 : stOpen[g.k];
    h += `<div class="sect"><button class="foldhead" data-fold="${g.k}"><span class="dotc" style="background:${g.c}"></span><span class="grow">${g.t}</span><span class="cnt">${g.list.length}</span><span class="chev" style="transform:rotate(${open?90:0}deg)">›</span></button>
      ${open && g.list.length ? `<div class="group glass">${g.list.map(cell).join('')}</div>` : ''}</div>`;
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-fold]').forEach(b => b.onclick = () => { stOpen[b.dataset.fold] = !stOpen[b.dataset.fold]; if(ql){ aQuery = ''; render(); } else drawAList(); });
  el.querySelectorAll('[data-auf]').forEach(b => b.onclick = () => { const A = aById(b.dataset.auf); if(isRun(A)){ fsRun = runBy[aKey(A)].eid; fsMin = false; render(); window.scrollTo(0,0); } else auftragSheet(A); });
  const an = el.querySelector('#anew'); if(an) an.onclick = () => newAuftragSheet(aQuery.trim());
}

function tick(){
  const now = Date.now(); if(!runs().length) return;
  const c = document.getElementById('clock'), fr = findRun(fsRun);
  if(c && fr) c.textContent = dur(entryDur(runEntry(fr), now).work, true);
  document.querySelectorAll('[data-live]').forEach(el => { const r = findRun(el.dataset.live); if(r) el.textContent = dur(entryDur(runEntry(r), now).work, true); });
}
setInterval(tick, 1000);

/* ---------- Tab: Auswertung ---------- */
function renderAusw(){
  const now = Date.now(), r = rangeKeys(aMode, aOff), s = summarize(r.keys, now);
  const sum = o => Object.values(o).reduce((x,y) => x+y, 0);
  let h = `<div class="nav"></div><div class="ttl">Auswertung</div><div class="subttl">Arbeits- und Maschinenzeiten pro Auftrag</div>
    <div class="seg glass">${['tag','woche','monat'].map(m => `<button data-mode="${m}" class="${aMode===m?'on':''}">${{tag:'Tag',woche:'Woche',monat:'Monat'}[m]}</button>`).join('')}</div>
    <div class="period"><button class="round glass" id="ap">‹</button><div class="pmid"><b>${esc(r.label)}</b>${aOff ? '<button class="todaybtn" id="atoday">Heute</button>' : ''}</div><button class="round glass" id="an">›</button></div>
    <div class="kpis glass"><div><span>Meine Zeit</span><b class="tnum">${dur(s.own)}</b></div><div><span>Maschinen</span><b class="tnum">${dur(sum(s.masch))}</b></div><div><span>Aufträge</span><b>${s.per.length}</b></div></div>`;
  if(aMode==='tag'){
    const ents = r.keys.flatMap(k => Object.values(state.days[k]||{})).sort((x,y) => x.s-y.s);
    h += `<div class="sect"><h2><span>${aOff===0?'Heute':'Buchungen'}</span><span>${ents.length} ${ents.length===1?'Buchung':'Buchungen'}</span></h2>
      <div class="group glass">${ents.length ? ents.map(x => entryCell(x, now)).join('') : '<div class="empty">Keine Buchungen an diesem Tag.</div>'}</div></div>`;
    if(s.per.length) h += `<div class="sect" style="margin-bottom:8px"><h2><span>Pro Auftrag</span></h2></div>`;
  }
  if(s.per.length){
    s.per.forEach((g, i) => {
      const mt = sum(g.masch);
      h += `<div class="sect"><div class="group glass">
        <div class="cell"><span class="cl two"><span class="nr" style="font-size:22px">#${esc(g.a.nr)}</span><small>${esc(g.a.produkt)}${(aFind(g.a)||{}).done ? ' · <span style="color:var(--green)">✓ fertig</span>' : ''}</small></span>
          <button class="round" style="background:var(--fill);color:var(--blue)" data-copy="${i}" aria-label="Kopieren">${ICON_COPY}</button></div>
        <div class="cell"><span class="icon" style="background:var(--blue)"><svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg></span><span class="cl">Meine Arbeitszeit</span>${timeVal(g.own)}</div>
        ${Object.entries(g.masch).sort((a,b) => b[1]-a[1]).map(([m,v]) => `<div class="cell"><span class="icon" style="background:var(--orange)">⚙︎</span><span class="cl">${esc(m)}</span>${timeVal(v)}</div>`).join('')}
        ${mt && Object.keys(g.masch).length > 1 ? `<div class="cell"><span class="icon" style="background:var(--fill)"></span><span class="cl dim">Maschinen gesamt</span>${timeVal(mt)}</div>` : ''}
      </div></div>`;
    });
  } else h += `<div class="sect"><div class="group glass"><div class="empty">Keine Buchungen in diesem Zeitraum.</div></div></div>`;
  h += `<div class="sect"><h2><span>Export für das Firmenprogramm</span></h2><div class="group glass">
      <button class="cell accent" id="ex1"><span class="cl">Zeiten pro Auftrag</span><span style="width:22px">${ICON_SHARE}</span></button>
      <button class="cell accent" id="ex2"><span class="cl">Alle Buchungen einzeln</span><span style="width:22px">${ICON_SHARE}</span></button>
    </div><div class="foot">CSV-Datei, lässt sich in Excel oder Numbers öffnen.</div></div>`;
  view.innerHTML = h;
  view.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { aMode = b.dataset.mode; aOff = 0; render(); });
  document.getElementById('ap').onclick = () => { aOff--; render(); };
  document.getElementById('an').onclick = () => { aOff++; render(); };
  const at = document.getElementById('atoday'); if(at) at.onclick = () => { aOff = 0; render(); };
  bindEntries();
  document.getElementById('ex1').onclick = () => offerFile(`Auftraege_${r.fname}.csv`, csvAuftraege(r.keys));
  document.getElementById('ex2').onclick = () => offerFile(`Buchungen_${r.fname}.csv`, csvBuchungen(r.keys));
  view.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const g = s.per[+b.dataset.copy];
    const mt = Object.entries(g.masch).map(([m,v]) => `  ${m}: ${dur(v)} (${dec(v)})`).join('\n');
    copyText(`Auftrag ${g.a.nr} – ${g.a.produkt}\nZeitraum: ${r.label}\nArbeitszeit: ${dur(g.own)} (${dec(g.own)})` + (mt ? `\nMaschinenzeiten:\n${mt}` : ''));
  });
}

/* ---------- Tab: Buchungen ---------- */
function renderBuch(){
  const now = Date.now(), entries = Object.values(state.days[bDay]||{}).sort((a,b) => a.s-b.s), s = summarize([bDay], now);
  view.innerHTML = `<div class="nav"><span></span><button class="round glass" id="badd" aria-label="Nachtragen">＋</button></div>
    <div class="ttl">Buchungen</div><div class="subttl">${entries.length} ${entries.length===1?'Buchung':'Buchungen'} · ${dur(s.own)} gearbeitet</div>
    <div class="period"><button class="round glass" id="bp">‹</button>
      <div class="pmid"><label style="position:relative"><b>${dstr(bDay)}</b><input type="date" id="bdate" value="${bDay}" style="position:absolute;inset:0;opacity:0"></label>${bDay !== dayKey(new Date()) ? '<button class="todaybtn" id="btoday">Heute</button>' : ''}</div>
      <button class="round glass" id="bn">›</button></div>
    <div class="sect"><div class="group glass">${entries.length ? entries.map(e => entryCell(e, now)).join('') : '<div class="empty">Keine Buchungen an diesem Tag.</div>'}</div></div>`;
  const shift = n => { const d = parseDay(bDay); d.setDate(d.getDate()+n); bDay = dayKey(d); render(); };
  document.getElementById('bp').onclick = () => shift(-1);
  document.getElementById('bn').onclick = () => shift(1);
  document.getElementById('bdate').onchange = ev => { if(ev.target.value){ bDay = ev.target.value; render(); } };
  document.getElementById('badd').onclick = () => editEntry(bDay, null);
  const bt = document.getElementById('btoday'); if(bt) bt.onclick = () => { bDay = dayKey(new Date()); render(); };
  bindEntries();
}

/* ---------- Tab: Verwalten ---------- */
function getTheme(){ try{ const t = localStorage.getItem('zs-theme'); return t==='light'||t==='dark' ? t : 'auto'; }catch(e){ return 'auto'; } }
function setTheme(t){
  try{ if(t==='auto') localStorage.removeItem('zs-theme'); else localStorage.setItem('zs-theme', t); }catch(e){}
  applyTheme();
}
function applyTheme(){
  const t = getTheme(), de = document.documentElement;
  if(t==='auto'){ de.removeAttribute('data-theme'); de.style.colorScheme = ''; } else { de.setAttribute('data-theme', t); de.style.colorScheme = t; }
}
applyTheme();
const LISTS = {
  ab:{ t:'Arbeitsabläufe', c:'var(--indigo)', i:'▤' }, auftraege:{ t:'Aufträge', c:'var(--blue)', i:'#' },
  taet:{ t:'Tätigkeiten', c:'var(--green)', i:'≡' }, masch:{ t:'Maschinen', c:'var(--orange)', i:'⚙︎' }
};
function renderEinst(){
  const st = state.stamm;
  if(einSub) return renderSub(einSub);
  const cnt = { ab: st.ablaeufe.length, auftraege: st.auftraege.filter(a => !a.done).length, taet: st.taet.length, masch: st.masch.length };
  const navCell = k => `<button class="cell" data-sub="${k}"><span class="icon" style="background:${LISTS[k].c}">${LISTS[k].i}</span><span class="cl">${LISTS[k].t}</span><span class="cv">${cnt[k]}</span><span class="chev">›</span></button>`;
  view.innerHTML = `<div class="nav"></div><div class="ttl">Verwalten</div><div class="subttl">Vorlagen, Listen und Sicherung</div>
    <div class="sect"><h2><span>Vorlagen</span></h2><div class="group glass">${navCell('ab')}</div></div>
    <div class="sect"><h2><span>Auswahllisten</span></h2><div class="group glass">${navCell('auftraege')}${navCell('taet')}${navCell('masch')}</div>
      <div class="foot">Neue Einträge landen beim Starten automatisch hier.</div></div>
    <div class="sect"><h2><span>Darstellung</span></h2>
      <div class="seg glass" style="margin-bottom:0">${[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']].map(([k,l]) => `<button data-theme-set="${k}" class="${getTheme()===k?'on':''}">${l}</button>`).join('')}</div>
      <div class="foot">„Automatisch“ folgt der Einstellung deines iPhones.</div></div>
    <div class="sect"><h2><span>Speicher</span></h2><div class="group glass">
      <div class="cell"><span class="cl">Status</span><span class="cv" id="sync">${esc(syncStatus)}</span></div>
      <div class="cell"><span class="cl">Letzte Sicherung</span><span class="cv">${(() => { let t = 0; try{ t = +localStorage.getItem('zs-lastbackup') || 0; }catch(e){} return t ? new Date(t).toLocaleDateString('de-DE') : '<span style="color:var(--orange)">noch keine</span>'; })()}</span></div>
      <button class="cell accent" id="bkexp">Sicherung exportieren</button>
      <button class="cell accent" id="bkimp">Sicherung importieren</button></div>
      <div class="foot">Tipp: In Safari „Teilen“ → „Zum Home-Bildschirm“ – dann startet die App mit einem Tipp.</div></div>`;
  view.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { einSub = b.dataset.sub; render(); window.scrollTo(0,0); });
  view.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet); render(); });
  document.getElementById('bkexp').onclick = async () => {
    const ok = await offerFile('zeitstempel-sicherung-' + dayKey(new Date()) + '.json', JSON.stringify(state));
    if(ok){ try{ localStorage.setItem('zs-lastbackup', String(Date.now())); }catch(e){} render(); }
  };
  document.getElementById('bkimp').onclick = importBackup;
}
function renderSub(k){
  const st = state.stamm; let list = '';
  if(k==='ab') list = st.ablaeufe.length ? `<div class="group glass">${st.ablaeufe.map(x => `<button class="cell" data-it="${x.id}"><span class="cl two"><span>${esc(x.name)}</span><small>${x.steps.map(s => esc(s.t)).join(' → ')}</small></span><span class="chev">›</span></button>`).join('')}</div>`
      : `<div class="group glass"><div class="empty">Lege feste Abläufe an, z. B.<br>„Rüsten → Drehen → Entgraten → Prüfen“.</div></div>`;
  else if(k==='auftraege'){
    const cell = a => `<button class="cell" data-it="${a.id}"><span class="cl two"><span class="nr">#${esc(a.nr)}</span><small>${esc(a.produkt||'–')}</small></span><span class="chev">›</span></button>`;
    const open = st.auftraege.filter(a => !a.done), done = st.auftraege.filter(a => a.done);
    list = `<div class="sect"><h2><span>Offen</span></h2><div class="group glass">${open.map(cell).join('') || '<div class="empty">Keine offenen Aufträge.</div>'}</div></div>`
      + (done.length ? `<div class="sect"><h2><span>Fertig gemeldet</span></h2><div class="group glass">${done.map(cell).join('')}</div><div class="foot">Fertige Aufträge erscheinen nicht mehr in der Auswahl. Ihre Zeiten bleiben erhalten.</div></div>` : '');
  } else list = st[k].length ? `<div class="group glass">${st[k].map(x => `<button class="cell" data-it="${x.id}"><span class="cl">${esc(x.name)}</span><span class="chev">›</span></button>`).join('')}</div>`
      : `<div class="group glass"><div class="empty">Noch leer – wird beim Starten automatisch gefüllt.</div></div>`;
  view.innerHTML = `<div class="nav"><button class="back" id="back">‹ Verwalten</button><button class="round glass" id="add" aria-label="Hinzufügen">＋</button></div>
    <div class="ttl">${LISTS[k].t}</div><div class="subttl"></div>${list}`;
  document.getElementById('back').onclick = () => { einSub = null; render(); };
  document.getElementById('add').onclick = () => k==='ab' ? editAblauf(null) : editItem(k, null);
  view.querySelectorAll('[data-it]').forEach(b => b.onclick = () => k==='ab' ? editAblauf(b.dataset.it) : editItem(k, b.dataset.it));
}
function editItem(k, id){
  const st = state.stamm, isA = k==='auftraege';
  const x = id ? st[k].find(y => y.id===id) : null;
  let armed = false;
  const body = openSheet(1, { title: x ? ({auftraege:'Auftrag',taet:'Tätigkeit',masch:'Maschine'}[k]) : 'Neu', right:'Sichern', onRight: save });
  body.innerHTML = isA
    ? `<div class="sect"><div class="group">
        <label class="cell"><span>Auftrags-Nr.</span><input id="ei-nr" value="${esc(x?x.nr:'')}" style="flex:1"></label>
        <label class="cell"><span>Produkt</span><input id="ei-pr" value="${esc(x?x.produkt:'')}" placeholder="Produktname" style="flex:1"></label></div></div>
      ${x ? `<div class="sect"><div class="group"><label class="cell"><span class="cl">Fertig gemeldet</span><input type="checkbox" class="sw" id="ei-done" ${x.done?'checked':''}></label></div></div>` : ''}`
    : `<div class="sect"><div class="group"><label class="cell"><input class="left" id="ei-n" value="${esc(x?x.name:'')}" placeholder="Name"></label></div>
       ${x ? '<div class="foot">Umbenennen ändert nur künftige Buchungen.</div>' : ''}</div>`;
  if(x) body.insertAdjacentHTML('beforeend', `<div class="group"><button class="cell danger" id="ei-del">Löschen</button></div>`);
  function save(){
    if(isA){
      const nr = document.getElementById('ei-nr').value.trim(), pr = document.getElementById('ei-pr').value.trim();
      if(!nr) return toast('Auftrags-Nr. fehlt');
      if(x){ x.nr = nr; x.produkt = pr; x.done = document.getElementById('ei-done').checked; persist('stamm'); } else ensureAuftrag(nr, pr);
    } else {
      const n = document.getElementById('ei-n').value.trim(); if(!n) return toast('Name fehlt');
      if(x){ x.name = n; persist('stamm'); } else ensureName(k, n);
    }
    closeSheet(1); toast('Gespeichert');
  }
  const del = document.getElementById('ei-del');
  if(del) del.onclick = () => {
    if(!armed){ armed = true; del.textContent = 'Wirklich löschen?'; return; }
    st[k] = st[k].filter(y => y.id !== id); persist('stamm'); closeSheet(1); toast('Gelöscht');
  };
}

/* ---------- Buchung bearbeiten ---------- */
function editEntry(day, eid){
  const orig = eid ? state.days[day] && state.days[day][eid] : null;
  if(eid && !orig) return;
  const runObj = findRun(eid), running = !!runObj;
  const now = Date.now(), last = state.stamm.last || {};
  const e = orig ? clone(orig) : { a:null, t:last.t||'', m:'', s:parseDay(day).setHours(8,0,0,0), e:parseDay(day).setHours(9,0,0,0), p:[], note:'' };
  let aId = e.a ? (ensureAuftrag(e.a.nr, e.a.produkt)||{}).id : last.a;
  const pMin = Math.round(entryDur(e, now).pause/60000);
  const x = { day, s:hm(e.s), e:e.e?hm(e.e):'', p:pMin, t:e.t, m:e.m||'', note:e.note||'' };
  let armed = false;
  const body = openSheet(1, { title: orig ? 'Buchung' : 'Nachtragen', right:'Sichern', onRight: save });
  const read = () => {
    const g = id => document.getElementById(id);
    if(!g('xe-day')) return;
    x.day = g('xe-day').value || x.day; x.s = g('xe-s').value; if(!running){ x.e = g('xe-e').value; x.p = g('xe-p').value; } x.note = g('xe-n').value;
  };
  const draw = () => {
    body.innerHTML = `
      ${e.ab ? `<div class="subttl" style="text-align:center;margin-bottom:12px">${esc(e.ab.n)} · Schritt ${e.ab.i+1} von ${e.ab.of}</div>` : ''}
      <div class="sect"><div class="group">
        <label class="cell"><span class="cl">Datum</span><input type="date" id="xe-day" value="${x.day}"></label>
        <label class="cell"><span class="cl">Start</span><input type="time" id="xe-s" value="${x.s}"></label>
        <label class="cell"><span class="cl">Ende</span>${running ? '<span class="cv">läuft noch</span>' : `<input type="time" id="xe-e" value="${x.e}">`}</label>
        ${running ? '' : `<label class="cell"><span class="cl">Pause</span><input type="number" id="xe-p" min="0" inputmode="numeric" value="${x.p}" style="width:70px"><span class="dim">min</span></label>`}
      </div></div>
      <div class="sect"><div class="group">${pickCell('a','Auftrag',aVal(aById(aId)),'Wählen')}${pickCell('t','Tätigkeit',esc(x.t),'Wählen')}${pickCell('m','Maschine',esc(x.m),'Ohne')}</div></div>
      <div class="sect"><h2><span>Notiz</span></h2><div class="group"><div class="cell"><textarea id="xe-n" placeholder="Optional">${esc(x.note)}</textarea></div></div></div>
      ${orig && !running ? '<div class="group"><button class="cell danger" id="xe-del">Buchung löschen</button></div>' : ''}`;
    body.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => {
      read();
      const k = b.dataset.pk;
      const v = await pick({ a:'auftrag', t:'taet', m:'masch' }[k], k==='a' ? aId : x[k], k==='m' ? { none:'Ohne Maschine' } : {});
      if(v !== undefined){ if(k==='a') aId = v; else x[k] = v; draw(); }
    });
    const del = document.getElementById('xe-del');
    if(del) del.onclick = () => {
      if(!armed){ armed = true; del.textContent = 'Wirklich löschen?'; return; }
      delete state.days[day][e.id]; persist('d-'+day); closeSheet(1); toast('Gelöscht');
    };
  };
  function save(){
    read();
    const A = aById(aId);
    if(!A) return toast('Bitte Auftrag wählen');
    if(!x.t) return toast('Bitte Tätigkeit wählen');
    if(!x.s) return toast('Startzeit fehlt');
    const [sh, sm] = x.s.split(':').map(Number);
    const s = parseDay(x.day).setHours(sh, sm, 0, 0);
    const ne = { ...e, id: e.id || uid(), a:{ nr:A.nr, produkt:A.produkt }, t:x.t, m:x.m||'', s, note:x.note };
    if(!running){
      if(!x.e) return toast('Endzeit fehlt');
      const [eh, em] = x.e.split(':').map(Number);
      let end = parseDay(x.day).setHours(eh, em, 0, 0); if(end <= s) end += 86400000;
      ne.e = end;
      const pm = Math.max(0, parseInt(x.p)||0);
      if(pm !== pMin || (orig && orig.s !== s)) ne.p = pm ? [[s, s + pm*60000]] : [];
      if(end - s - pm*60000 < 0) return toast('Pause ist länger als die Buchung');
    }
    if(orig && x.day !== day){ delete state.days[day][e.id]; persist('d-'+day); if(runObj){ runObj.day = x.day; persist('aktiv'); } }
    state.days[x.day] = state.days[x.day] || {}; state.days[x.day][ne.id] = ne; persist('d-'+x.day);
    closeSheet(1); toast('Gespeichert');
  }
  draw();
}

/* ---------- Arbeitsablauf bearbeiten ---------- */
function editAblauf(id){
  const st = state.stamm, orig = id ? st.ablaeufe.find(x => x.id===id) : null;
  let name = orig ? orig.name : '', steps = orig ? clone(orig.steps) : [{ t:'', m:'' }], armed = false;
  const body = openSheet(1, { title: orig ? 'Arbeitsablauf' : 'Neuer Arbeitsablauf', right:'Sichern', onRight: save });
  const readName = () => { const n = document.getElementById('ab-name'); if(n) name = n.value; };
  const draw = () => {
    body.innerHTML = `<div class="sect"><div class="group"><label class="cell"><input class="left" id="ab-name" value="${esc(name)}" placeholder="Name, z. B. Welle fertigen"></label></div></div>
      <div class="sect"><h2><span>Schritte</span></h2>
      ${steps.map((s,i) => `<div class="stepbox">
        <div class="stephead"><span>SCHRITT ${i+1}</span><span class="mini">
          <button data-up="${i}" ${i===0?'disabled':''} aria-label="hoch">↑</button><button data-dn="${i}" ${i===steps.length-1?'disabled':''} aria-label="runter">↓</button><button class="x" data-rs="${i}" aria-label="entfernen">✕</button></span></div>
        ${pickCell('t'+i,'Tätigkeit',esc(s.t),'Wählen')}${pickCell('m'+i,'Maschine',esc(s.m),'Ohne')}
      </div>`).join('')}
      <div class="group" style="background:var(--glass)"><button class="cell accent" id="ab-add" style="justify-content:center">＋ Schritt hinzufügen</button></div></div>
      ${orig ? '<div class="group" style="background:var(--glass)"><button class="cell danger" id="ab-del">Arbeitsablauf löschen</button></div>' : ''}`;
    body.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => {
      readName();
      const k = b.dataset.pk[0], i = +b.dataset.pk.slice(1);
      const v = await pick(k==='t' ? 'taet' : 'masch', steps[i][k], k==='m' ? { none:'Ohne Maschine' } : {});
      if(v !== undefined){ steps[i][k] = v; draw(); }
    });
    body.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { readName(); const i = +b.dataset.up; [steps[i-1], steps[i]] = [steps[i], steps[i-1]]; draw(); });
    body.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { readName(); const i = +b.dataset.dn; [steps[i+1], steps[i]] = [steps[i], steps[i+1]]; draw(); });
    body.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { readName(); steps.splice(+b.dataset.rs, 1); draw(); });
    document.getElementById('ab-add').onclick = () => { readName(); steps.push({ t:'', m:'' }); draw(); };
    const del = document.getElementById('ab-del');
    if(del) del.onclick = () => {
      if(!armed){ armed = true; del.textContent = 'Wirklich löschen?'; return; }
      st.ablaeufe = st.ablaeufe.filter(x => x.id !== id); persist('stamm'); closeSheet(1); toast('Gelöscht');
    };
  };
  function save(){
    readName();
    const clean = steps.filter(s => s.t);
    if(!name.trim()) return toast('Bitte einen Namen eingeben');
    if(!clean.length) return toast('Mindestens ein Schritt mit Tätigkeit');
    if(orig){ orig.name = name.trim(); orig.steps = clean; } else st.ablaeufe.push({ id:uid(), name:name.trim(), steps:clean });
    persist('stamm'); closeSheet(1); toast('Arbeitsablauf gespeichert');
  }
  draw();
}

/* ---------- Export, Kopieren, Sicherung ---------- */
const STANDALONE = !(window.claude && window.claude.use);
async function offerFile(filename, text){
  if(!STANDALONE){
    try{
      const dl = await claude.use('downloads');
      if(dl){ await dl.save({ filename, data: text }); return true; }
    }catch(e){ if(e && /declin|cancel|abort|reject/i.test((e.code||'')+(e.message||''))) return false; }
  } else {
    const type = filename.endsWith('.csv') ? 'text/csv' : 'application/json';
    try{
      const file = new File([text], filename, { type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return true; }
    }catch(e){ if(e && e.name === 'AbortError') return false; }
    try{
      const url = URL.createObjectURL(new Blob([text], { type }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000); return true;
    }catch(e){}
  }
  const body = openSheet(1, { title:'Export', left:'Fertig' });
  body.innerHTML = `<div class="subttl" style="text-align:center">${esc(filename)}<br>Download geht hier nicht – kopiere den Text und füge ihn in Excel oder Numbers ein.</div>
    <div class="group"><div class="cell"><textarea id="ftxt" readonly style="min-height:240px;font-size:13px">${esc(text)}</textarea></div></div>
    <button class="cta blue" id="fcopy" style="margin-top:16px">Kopieren</button>`;
  document.getElementById('fcopy').onclick = () => copyText(text, document.getElementById('ftxt'));
}
async function copyText(text, ta){
  try{ await navigator.clipboard.writeText(text); toast('In die Zwischenablage kopiert'); }
  catch(e){ if(ta){ ta.select(); toast('Markiert – jetzt kopieren'); } else toast('Kopieren nicht möglich'); }
}
function importBackup(){
  const body = openSheet(1, { title:'Sicherung importieren', right:'Import', onRight: run });
  body.innerHTML = `<div class="subttl" style="text-align:center">Buchungen werden ergänzt, Listen zusammengeführt.</div>
    <div class="sect"><div class="group"><label class="cell accent"><span class="cl">Datei auswählen…</span><input type="file" id="impf" accept=".json,application/json" style="display:none"></label></div></div>
    <div class="sect"><h2><span>oder Inhalt einfügen</span></h2><div class="group"><div class="cell"><textarea id="impt" style="min-height:140px"></textarea></div></div></div>`;
  document.getElementById('impf').onchange = async ev => { const f = ev.target.files[0]; if(f) document.getElementById('impt').value = await f.text(); };
  function run(){
    try{
      const d = JSON.parse(document.getElementById('impt').value);
      if(!d || !d.days || !d.stamm) throw 0;
      for(const k in d.days){ state.days[k] = Object.assign(state.days[k]||{}, d.days[k]); persist('d-'+k); }
      const st = state.stamm;
      (d.stamm.taet||[]).forEach(x => ensureName('taet', x.name));
      (d.stamm.masch||[]).forEach(x => ensureName('masch', x.name));
      (d.stamm.auftraege||[]).forEach(x => { const a = ensureAuftrag(x.nr, x.produkt); if(a && x.done) a.done = true; });
      (d.stamm.ablaeufe||[]).forEach(x => { if(!st.ablaeufe.some(y => y.id===x.id)) st.ablaeufe.push(x); });
      persist('stamm'); closeSheet(1); toast('Import erfolgreich');
    }catch(e){ toast('Ungültige Sicherung'); }
  }
}

/* ---------- Start ---------- */
function render(){
  document.body.classList.remove('fs');
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  ({ stopp:renderStopp, ausw:renderAusw, buch:renderBuch, einst:renderEinst })[tab]();
  renderMini();
}
document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => { if(tab==='einst' && b.dataset.tab==='einst') einSub = null; tab = b.dataset.tab; render(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !sheetOpen()) render(); });
loadLocal();
render();
initCloud();
if(STANDALONE){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    const lb = +localStorage.getItem('zs-lastbackup') || 0;
    if(Object.keys(state.days).length && Date.now() - lb > 7*86400000) setTimeout(() => toast('Zeit für eine Sicherung – unter „Verwalten“'), 1500);
  }catch(e){}
}
