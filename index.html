<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeitstempel">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#141513">
<script>try{var th=localStorage.getItem("zs-theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th);}catch(e){}</script>
<title>Zeitstempel</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#141513; --text:#fff; --sec:rgba(235,235,245,.62); --ter:rgba(235,235,245,.3);
  --glass:rgba(34,34,32,.45); --glass-strong:rgba(38,38,36,.78); --edge:rgba(255,255,255,.16); --hi:rgba(255,255,255,.22);
  --sep:rgba(255,255,255,.1); --fill:rgba(118,118,128,.24); --shadow:0 10px 40px rgba(0,0,0,.35);
  --blue:#8FCFD2; --green:#62C27E; --orange:#EBD27E; --red:#FF453A; --indigo:#7B55B0;
  --b1:#24063F; --b2:#123E40; --b3:#3A3112;
  --tq:#8FCFD2; --yl:#EBD27E; --pu:#2C0050; --ink:#1C1D1B; --acc-t:#8FCFD2; --yl-t:#EBD27E;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]){
    --bg:#F5F5F2; --text:#1C1D1B; --sec:rgba(28,29,27,.6); --ter:rgba(28,29,27,.3);
    --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.85); --edge:rgba(0,0,0,.06); --hi:rgba(255,255,255,.6);
    --sep:rgba(28,29,27,.12); --fill:rgba(28,29,27,.07); --shadow:0 10px 40px rgba(44,0,80,.10);
    --blue:#8FCFD2; --green:#62C27E; --orange:#EBD27E; --red:#E0352B; --indigo:#7B55B0; --acc-t:#3C9DA2; --yl-t:#9C8430;
    --b1:#CDB5EE; --b2:#8FE0E3; --b3:#F7DE7A;
  }
}
:root[data-theme=light]{
    --bg:#F5F5F2; --text:#1C1D1B; --sec:rgba(28,29,27,.6); --ter:rgba(28,29,27,.3);
    --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.85); --edge:rgba(0,0,0,.06); --hi:rgba(255,255,255,.6);
    --sep:rgba(28,29,27,.12); --fill:rgba(28,29,27,.07); --shadow:0 10px 40px rgba(44,0,80,.10);
    --blue:#8FCFD2; --green:#62C27E; --orange:#EBD27E; --red:#E0352B; --indigo:#7B55B0; --acc-t:#3C9DA2; --yl-t:#9C8430;
    --b1:#CDB5EE; --b2:#8FE0E3; --b3:#F7DE7A;
  }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:17px;letter-spacing:-.01em;color:var(--text);background:var(--bg);min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 110px);
  -webkit-font-smoothing:antialiased;
}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.blobs i:nth-child(1){width:420px;height:420px;background:var(--b1);top:-140px;left:-120px}
.blobs i:nth-child(2){width:360px;height:360px;background:var(--b2);top:30%;right:-160px}
.blobs i:nth-child(3){width:380px;height:380px;background:var(--b3);bottom:-160px;left:-80px}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}

/* Kopf */
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.nav .back{background:none;border:0;color:var(--blue);font:inherit;padding:8px 0;display:flex;align-items:center;gap:2px}
.ttl{font-size:34px;font-weight:800;letter-spacing:.01em;margin:2px 4px 2px}
.subttl{color:var(--sec);font-size:15px;margin:0 4px 18px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);font-size:22px;border:0;font-weight:400;padding:0}
.round svg{width:20px;height:20px}

/* Gruppen wie in iOS-Einstellungen */
.sect{margin:0 0 22px}
.sect>h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--sec);margin:0 16px 7px;letter-spacing:0;display:flex;justify-content:space-between}
.sect>.foot{font-size:13px;color:var(--sec);margin:7px 16px 0}
.group{border-radius:24px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:11px 16px;background:none;border:0;color:var(--text);font:inherit;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active{background:var(--fill)}
.cell .cl{flex:1;min-width:0}
.cell .cv{color:var(--sec);text-align:right;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cv.ph{color:var(--blue)}
.cell .chev{color:var(--ter);font-size:20px;margin-left:-4px}
.cell .two{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .two small{color:var(--sec);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.cell input,.cell select{background:none;border:0;color:var(--sec);font:inherit;text-align:right;min-width:0;padding:0;outline:none}
.cell input.left{text-align:left;color:var(--text);flex:1}
.cell textarea{flex:1;background:none;border:0;color:var(--text);font:inherit;resize:none;min-height:60px;outline:none;padding:0}
.cell.danger{color:var(--red);justify-content:center}
.cell.accent{color:var(--blue)}
.tnum{font-variant-numeric:tabular-nums}
.nr{font-weight:600}
.dim{color:var(--sec)}

/* Segment */
.seg{display:flex;padding:3px;border-radius:999px;margin-bottom:18px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:15px;font-weight:500;padding:8px 6px;border-radius:999px;opacity:.75}
.seg button.on{background:var(--glass-strong);opacity:1;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 1px 0 var(--hi)}

/* Knöpfe */
.cta{display:block;width:100%;border:0;border-radius:999px;padding:17px;font:inherit;font-size:18px;font-weight:600;color:#fff;margin:4px 0 26px;box-shadow:0 8px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.cta:active{transform:scale(.98)}
.cta.green{background:var(--yl);color:var(--ink)} .cta.blue{background:var(--tq);color:var(--ink)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.circ{width:78px;height:78px;border-radius:50%;border:0;font:inherit;font-size:15px;font-weight:500;display:grid;place-items:center;
  box-shadow:inset 0 1px 0 var(--hi)}
.circ.gray{background:var(--fill);color:var(--text)}
.circ.red{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.circ.orange{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange)}
.circ.green{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.capsule{flex:1;margin:0 12px;height:78px;border-radius:999px;border:0;background:var(--tq);color:var(--ink);font:inherit;font-size:17px;font-weight:700;
  box-shadow:0 8px 24px rgba(143,207,210,.25),inset 0 1px 0 rgba(255,255,255,.35);padding:0 14px;line-height:1.2}
.capsule small{display:block;font-size:13px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn{background:none;border:0;color:var(--blue);font:inherit;padding:10px;display:block;margin:0 auto 22px}

/* Laufende Aufgabe */
.hero{border-radius:32px;padding:22px 20px 22px;margin-bottom:14px}
.hero .meta{font-size:15px;color:var(--sec);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 25%,transparent)}
.live.p{background:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 25%,transparent)}
.hero h3{font-size:26px;font-weight:700;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--text);margin:2px 4px 2px 0}
.clock{font-size:76px;font-weight:200;letter-spacing:-.02em;text-align:center;margin:18px 0 4px;font-variant-numeric:tabular-nums}
.prog{display:flex;gap:4px;margin:14px 0 6px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--fill)}
.prog i.d{background:var(--tq);opacity:.5} .prog i.c{background:var(--tq)}
.progtxt{font-size:13px;color:var(--sec);text-align:center}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-radius:24px;overflow:hidden;margin-bottom:22px}
.kpis div{padding:14px 12px;text-align:center}
.kpis div+div{border-left:.5px solid var(--sep)}
.kpis b{display:block;font-size:22px;font-weight:600;margin-top:2px}
.kpis span{font-size:12px;color:var(--sec)}
.period{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 16px}
.period b{font-size:15px;font-weight:600}

/* Sheets */
.layer{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.layer.open{opacity:1;pointer-events:auto}
.layer.l2{z-index:40}
.sheet{width:100%;max-height:94vh;overflow:auto;border-radius:30px 30px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border-top:.5px solid var(--edge);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.layer.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:0 auto 6px}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:14px}
.shead b{font-size:17px;font-weight:600;text-align:center}
.shead button{background:none;border:0;font:inherit;color:var(--blue);padding:8px 0}
.shead button.r{text-align:right;font-weight:600}
.shead button.l{text-align:left}
.sheet .group{background:var(--glass)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:9px 12px;margin-bottom:16px}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;outline:none}
.check{color:var(--blue);font-weight:600}
.stepbox{border-radius:20px;overflow:hidden;margin-bottom:10px;background:var(--glass)}
.stephead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0;font-size:13px;color:var(--sec)}
.stephead .smini{display:flex;gap:4px}
.stephead .smini button{background:var(--fill);border:0;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:14px}
.stephead .smini button:disabled{opacity:.3}
.stephead .smini button.x{color:var(--red)}

/* Tab-Leiste */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;
  display:flex;gap:2px;padding:5px;border-radius:999px;width:min(calc(100% - 32px),420px)}
.tabbar button{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:999px;opacity:.7}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{opacity:1;color:var(--blue);background:var(--fill)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);z-index:60;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:500;
  transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
.empty{padding:22px 16px;text-align:center;color:var(--sec);font-size:15px}
.backbtn{background:none;border:0;color:var(--blue);font:inherit;padding:4px 0 12px;display:block}
.grow{flex:1;min-width:0}
:root:not([data-theme=light]) body:not(.vbmode) .blobs i{opacity:.28}
@media (prefers-color-scheme: light){ :root:not([data-theme=dark]) body:not(.vbmode) .blobs i{opacity:.32} }
:root[data-theme=light] body:not(.vbmode) .blobs i{opacity:.32}
.icon[style*="--orange"],.icon[style*="--blue"]{color:var(--ink)!important}
.live{background:var(--tq)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--tq) 25%,transparent)!important}
.live.p{background:var(--yl)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--yl) 25%,transparent)!important}
.foot{font-size:13px;color:var(--sec);margin:7px 16px 0}
.blobs i{transition:background 1s,opacity 1s}
body{transition:background-color .8s}
body.vbmode .blobs i{opacity:.95}
body.vbmode .vbtoggle.on{background:var(--yl);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.25)}
body.vbmode{--b1:#7B55B0;--b2:#4A1580;--b3:#8A3FD0;--bg:#2C0050}
@media (prefers-color-scheme: light){ body.vbmode:not([data-x]){--b1:#B993EA;--b2:#C9A8F0;--b3:#A57DE0;--bg:#D9C6F2} }
:root[data-theme=light] body.vbmode{--b1:#B993EA;--b2:#C9A8F0;--b3:#A57DE0;--bg:#D9C6F2}
:root[data-theme=dark] body.vbmode{--b1:#7B55B0;--b2:#4A1580;--b3:#8A3FD0;--bg:#2C0050}
.vbtoggle{border:0;font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:8px 16px;background:var(--fill);color:var(--sec);cursor:pointer}
.vbtoggle.on{background:var(--yl);color:var(--ink)}
.circ{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.circ.holding{animation:holdfill 1s linear forwards}
@keyframes holdfill{from{box-shadow:inset 0 0 0 0 var(--red)}to{box-shadow:inset 0 0 0 40px var(--red);color:#fff}}
.search.glass{box-shadow:none;border:.5px solid var(--edge);background:var(--fill)}
.todaybtn{border:0;font:inherit;font-size:13px;font-weight:600;color:var(--blue);background:var(--fill);border-radius:999px;padding:4px 12px;margin-top:4px}
.pmid{display:flex;flex-direction:column;align-items:center}
.others{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.ochip{display:inline-flex;align-items:center;gap:7px;border:0;font:inherit;font-size:13px;font-weight:500;color:var(--text);background:var(--fill);border-radius:999px;padding:6px 12px;cursor:pointer}
.ochip .live{width:7px;height:7px;box-shadow:none}
.foldhead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:20px;font-weight:700;padding:4px 6px 10px;text-align:left}
.foldhead .dotc{width:10px;height:10px;border-radius:50%;flex:none}
.foldhead .cnt{font-size:15px;font-weight:500;color:var(--sec);background:var(--fill);border-radius:999px;padding:2px 10px}
.foldhead .chev{color:var(--ter);font-size:22px;font-weight:400;transition:transform .2s}
body.fs{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)} body.fs .tabbar{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.fsview{min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 26px);display:flex;flex-direction:column}
.pill-live{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sec)}
.fstop{text-align:center;margin-top:16px}
.fsprod{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.fsnr{font-size:15px;color:var(--sec);margin-top:4px}
.fstask{font-size:19px;font-weight:500;margin-top:14px}
.fsclock{font-size:84px;margin:24px 0 22px}
.fssteps{border-radius:22px;padding:4px 16px;margin-bottom:auto;max-height:38vh;overflow:auto}
.fsstep{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:16px;color:var(--sec)}
.fsstep+.fsstep{border-top:.5px solid var(--sep)}
.fsstep .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:13px;font-weight:600;flex:none}
.fsstep.c{color:var(--text);font-weight:600} .fsstep.c .n{background:var(--tq);color:var(--ink)}
.fsstep.d .n{background:color-mix(in srgb,var(--green) 25%,transparent);color:var(--green)}
.fsbottom{padding-top:18px}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:19;width:min(calc(100% - 32px),420px);display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:20px;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.mini b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;font-size:13px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tnum{font-weight:600}
body.hasmini{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;transition:background .2s;flex:none;margin:0;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .2s}
.sw:checked{background:var(--green)} .sw:checked::after{left:22px}
.hidden{display:none!important}

/* ===== Übergänge im Apple-Stil ===== */
:root{--spring:cubic-bezier(.32,.72,0,1);--spring-b:cubic-bezier(.34,1.36,.64,1)}
.sheet{transition:transform .5s var(--spring)!important;will-change:transform}
.sheet.behind{transform:scale(.94) translateY(-10px)!important;filter:brightness(.85);border-radius:30px}
#view{transform-origin:50% 0;transition:transform .5s var(--spring),filter .5s var(--spring),border-radius .5s var(--spring)}
body.sheeted #view{transform:scale(.93) translateY(calc(env(safe-area-inset-top) + 6px));border-radius:22px;filter:brightness(.8) saturate(.9);overflow:hidden}
.tabbar{transition:transform .5s var(--spring),opacity .35s ease}
body.sheeted .tabbar{transform:translate(-50%,8px) scale(.94);opacity:.5}
.tabbar{position:fixed}
.tabpill{position:absolute;top:5px;left:5px;bottom:5px;border-radius:999px;background:var(--fill);transition:transform .5s var(--spring-b),width .4s var(--spring);pointer-events:none}
.tabbar button.on{background:none!important}
.tabbar button{position:relative;transition:color .3s,opacity .3s,transform .25s var(--spring-b)}
.tabbar button:active{transform:scale(.88)}
.toast{transition:transform .55s var(--spring-b)!important}
button.cell,.cta,.capsule,.circ,.round,.btn,.vbtoggle,.ochip,.todaybtn,.foldhead,.seg button{transition:transform .3s var(--spring-b),background-color .25s,opacity .25s,filter .2s}
button.cell:active{transform:scale(.985)}
.cta:active,.capsule:active,.circ:active,.round:active,.vbtoggle:active,.ochip:active{transform:scale(.94);filter:brightness(.92)}
.seg button.on{transition:background .35s var(--spring),box-shadow .35s}
.foldhead .chev{transition:transform .4s var(--spring-b)!important}
.prog i,.fsstep .n{transition:background .4s var(--spring)}
#mini{animation:miniIn .55s var(--spring-b)}
@keyframes miniIn{from{transform:translate(-50%,30px) scale(.9);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
/* Seiteninhalt */
@keyframes aRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes aFade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes aPush{from{opacity:.0;transform:translateX(34%)}to{opacity:1;transform:none}}
@keyframes aPop{from{opacity:0;transform:translateX(-26%)}to{opacity:1;transform:none}}
@keyframes aLeft{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes aRight{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes aZoomIn{from{opacity:0;transform:scale(.9) translateY(40px);border-radius:40px}to{opacity:1;transform:none}}
@keyframes aZoomOut{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#view.a-tab>*{animation:aRise .5s var(--spring) both}
#view.a-tab>*:nth-child(2){animation-delay:.02s} #view.a-tab>*:nth-child(3){animation-delay:.04s} #view.a-tab>*:nth-child(4){animation-delay:.06s}

<body>
<div class="blobs"><i></i><i></i><i></i></div>
<main id="view"></main>

<nav class="tabbar glass">
  <button data-tab="stopp" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.2 1.6M10 2.5h4M12 2.5V6M18.5 6.5l1.2-1.2"/></svg>Stempeln</button>
  <button data-tab="ausw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>Auswertung</button>
  <button data-tab="einst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Verwalten</button>
</nav>

<div class="layer" id="L1"><div class="sheet" id="S1"></div></div>
<div class="layer l2" id="L2"><div class="sheet" id="S2"></div></div>
<div id="toast" class="toast glass"></div>

<script>

/* =========================================================
   Datenmodell
   stamm:  { auftraege:[{id,nr,produkt,done}], taet:[{id,name}], masch:[{id,name}],
             ablaeufe:[{id,name,steps:[{t,m}]}], last:{a,t,m,ab} }
   aktiv:  null | { day, eid, ab:{id,name,steps,idx} }
   days:   { 'YYYY-MM-DD': { <eid>: { id, a:{nr,produkt}, t, m, s, e, p:[[s,e]], ab:{n,i,of}, note } } }
   ========================================================= */
const LS_KEY = 'zeitstempel-v2';
const STAMM0 = () => ({ auftraege:[], taet:[], masch:[], ablaeufe:[], last:{} });
let state = { stamm: STAMM0(), aktiv: null, days: {} };

function loadLocal(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.days) state = s; }catch(e){}
  state.stamm = Object.assign(STAMM0(), state.stamm||{});
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- Cloud-Speicher ---------- */
let col = null, syncStatus = 'nur auf diesem Gerät';
const writing = {}, dirty = {};
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const clone = o => JSON.parse(JSON.stringify(o));

function bodyFor(id){
  if(id==='stamm') return state.stamm;
  if(id==='aktiv') return { v: state.aktiv };
  return { items: state.days[id.slice(2)] || {} };
}
function applyDoc(id, data){
  if(id==='stamm') state.stamm = Object.assign(STAMM0(), clone(data));
  else if(id==='aktiv') state.aktiv = data.v ? clone(data.v) : null;
  else if(id.startsWith('d-')) state.days[id.slice(2)] = clone(data.items||{});
}

async function initCloud(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    col = db.collection('data/users/' + uid);
    syncStatus = 'verbinde…'; renderSyncInfo();
    let first = true;
    const timer = setTimeout(()=>{ if(first){ syncStatus = 'Cloud nicht erreichbar – speichert auf dem Gerät'; renderSyncInfo(); } }, 10000);
    col.onSnapshot(snap => {
      if(snap.metadata.fromCache && first) return;
      if(first){
        first = false; clearTimeout(timer);
        if(snap.empty){
          // Erstes Mal: vorhandene Gerätedaten hochladen
          persist('stamm'); persist('aktiv'); Object.keys(state.days).forEach(d => persist('d-'+d));
          syncStatus = 'synchronisiert'; renderSyncInfo(); return;
        }
      }
      let changed = false;
      snap.docs.forEach(d => { if(writing[d.id] || dirty[d.id]) return; const data = d.data(); if(!data) return; try{ if(JSON.stringify(bodyFor(d.id)) === JSON.stringify(data)) return; }catch(e){} applyDoc(d.id, data); changed = true; });
      syncStatus = 'synchronisiert';
      if(changed){ saveLocal(); if(!sheetOpen()) render(); }
      renderSyncInfo();
    }, () => { clearTimeout(timer); syncStatus = 'Cloud getrennt – speichert auf dem Gerät'; renderSyncInfo(); });
  }catch(e){}
}
function persist(docId){
  saveLocal();
  if(!col) return;
  dirty[docId] = true;
  if(!writing[docId]) flush(docId);
}
async function flush(id){
  writing[id] = true; let retried = false;
  while(dirty[id]){
    dirty[id] = false;
    try{ await col.doc(id).set(clone(bodyFor(id))); syncStatus = 'synchronisiert'; }
    catch(e){
      if(e && e.code==='unavailable' && !retried){ retried = true; dirty[id] = true; await sleep(600+Math.random()*900); continue; }
      syncStatus = 'Fehler beim Speichern in der Cloud – auf dem Gerät gesichert';
    }
  }
  writing[id] = false; renderSyncInfo();
}
function renderSyncInfo(){ const el = document.getElementById('sync'); if(el) el.textContent = syncStatus; }

/* ---------- Helfer ---------- */
const WT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const pad = n => String(n).padStart(2,'0');
const dayKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDay = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const hm = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const dstr = k => { const d = parseDay(k); return WT[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear(); };
function dur(ms, sec){ ms = Math.max(0, ms); const t = Math.floor(ms/1000); return Math.floor(t/3600)+':'+pad(Math.floor(t%3600/60))+(sec?':'+pad(t%60):''); }
const dec = ms => (Math.max(0,ms)/3600000).toFixed(2).replace('.',',') + ' h';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const aKey = a => (a && a.nr || '') + '|' + (a && a.produkt || '');
const aLabel = a => a ? aOne(a) : '–';

function entryDur(e, now){
  if(e.fx || e.fxp) return { work: 0, pause: 0 };
  const end = e.e || now;
  let p = 0; (e.p||[]).forEach(([ps,pe]) => { p += (pe || end) - ps; });
  return { work: Math.max(0, end - e.s - p), pause: p };
}
function isPaused(e){ const p = e.p||[]; return p.length && !p[p.length-1][1]; }

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2000); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate(20); }catch(e){} }

/* ---------- Stammdaten ---------- */
function ensureName(listName, name){
  name = (name||'').trim(); if(!name) return '';
  const L = state.stamm[listName];
  const f = L.find(x => x.name.toLowerCase() === name.toLowerCase());
  if(f) return f.name;
  const it = { id: uid(), name }; if(listName === 'masch') it.rp = defaultPhrase(name);
  L.push(it); persist('stamm'); return name;
}
function ensureAuftrag(nr, produkt, ein){
  nr = (nr||'').trim(); produkt = (produkt||'').trim(); ein = (ein||'').trim(); if(!nr && !produkt) return null;
  const L = state.stamm.auftraege;
  let f = L.find(x => x.nr === nr && x.produkt === produkt);
  if(!f){ f = { id: uid(), nr, produkt, done:false }; if(ein) f.ein = ein; L.push(f); persist('stamm'); }
  else if(ein && !f.ein){ f.ein = ein; persist('stamm'); }
  return f;
}
// Anzeige: Name groß, darunter klein Auftrags-Nr. und EIN (beides optional)
function aLive(a){ return (a && state.stamm.auftraege.find(x => x.nr===a.nr && x.produkt===a.produkt)) || a || {}; }
function aTitle(a){ return (a && (a.produkt || (a.nr ? '#'+a.nr : ''))) || 'Ohne Namen'; }
function aSub(a){ const L = aLive(a); return [a && a.produkt && a.nr ? '#'+a.nr : '', L.ein ? 'EIN '+L.ein : ''].filter(Boolean).join(' · '); }
function aOne(a){ const s = aSub(a); return aTitle(a) + (s ? ' · ' + s : ''); }


/* ---------- Zeiterfassung ---------- */
// Mehrere Aufgaben können gleichzeitig laufen: state.aktiv = [{ day, eid, ab }]
function runs(){
  let a = state.aktiv;
  if(!a) a = []; else if(!Array.isArray(a)) a = [a];
  a = a.filter(r => r && state.days[r.day] && state.days[r.day][r.eid] && !state.days[r.day][r.eid].e);
  state.aktiv = a; return a;
}
function runEntry(r){ return r && state.days[r.day] && state.days[r.day][r.eid] || null; }
function findRun(eid){ return eid ? runs().find(r => r.eid===eid) || null : null; }
function curEntry(){ return runEntry(runs()[0]); }
function stopRun(r, now){
  const e = runEntry(r);
  if(e && e.fxp){ delete state.days[r.day][r.eid]; persist('d-'+r.day); }
  else if(e){ if(isPaused(e)) e.p[e.p.length-1][1] = now; e.e = now; persist('d-'+r.day); }
  state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv');
}
function startEntry(auftrag, t, m, ab, now, vb){
  const day = dayKey(new Date(now));
  const e = { id: uid(), a:{ nr:auftrag.nr, produkt:auftrag.produkt }, t, m: m||'', s: now, e: null, p: [], note:'' };
  if(vb) e.vb = true;
  if(ab) e.ab = { n: ab.name, i: ab.idx, of: ab.steps.length, sid: ab.sid || '' };
  state.days[day] = state.days[day] || {};
  state.days[day][e.id] = e; persist('d-'+day);
  const r = { day, eid: e.id, ab: ab || null };
  state.aktiv = runs().concat([r]); persist('aktiv');
  return r;
}
function togglePause(r){
  const e = runEntry(r); if(!e) return;
  const now = Date.now();
  if(isPaused(e)) e.p[e.p.length-1][1] = now; else e.p.push([now, null]);
  persist('d-'+r.day); buzz(); render();
}
// Zeitabschnitte eines Eintrags ohne Pausen
function segs(e, now){
  if(e.fx || e.fxp) return [];
  const end = e.e || now, out = []; let cur = e.s;
  (e.p||[]).slice().sort((x,y) => x[0]-y[0]).forEach(([ps,pe]) => { pe = pe || end; if(ps > cur) out.push([cur, Math.min(ps, end)]); cur = Math.max(cur, pe); });
  if(end > cur) out.push([cur, end]);
  return out;
}
// tatsächlich gearbeitete Zeit: gleichzeitige Aufträge zählen nur einmal
function unionTime(list){
  list.sort((x,y) => x[0]-y[0]); let tot = 0, cs = null, ce = null;
  list.forEach(([s,e]) => { if(cs===null || s > ce){ if(cs!==null) tot += ce-cs; cs = s; ce = e; } else ce = Math.max(ce, e); });
  if(cs!==null) tot += ce-cs; return tot;
}

/* ---------- Auswertung ---------- */
function summarize(dayKeys, now){
  const per = {}; const masch = {}; const all = [];
  dayKeys.forEach(k => {
    const d = state.days[k]; if(!d) return;
    Object.values(d).forEach(e => {
      if(e.fxp) return;
      if(e.fx){
        const v = (+e.mt || 0) * 60000, key = aKey(e.a);
        const g = per[key] = per[key] || { a:e.a, own:0, vb:0, masch:{}, taet:{}, n:0 };
        g.n++; if(e.m){ g.masch[e.m] = (g.masch[e.m]||0) + v; masch[e.m] = (masch[e.m]||0) + v; }
        return;
      }
      const w = entryDur(e, now).work;
      segs(e, now).forEach(s => all.push(s));
      const key = aKey(e.a);
      const g = per[key] = per[key] || { a:e.a, own:0, vb:0, masch:{}, taet:{}, n:0 };
      g.own += w; g.n++; if(e.vb) g.vb += w;
      g.taet[e.t] = (g.taet[e.t]||0) + w;
      const mv = e.vb ? 0 : (e.mz != null ? (+e.mz)*60000 : w);
      if(e.m && mv){ g.masch[e.m] = (g.masch[e.m]||0) + mv; masch[e.m] = (masch[e.m]||0) + mv; }
    });
  });
  return { own: unionTime(all), masch, per: Object.values(per).sort((x,y)=>y.own-x.own) };
}
function rangeKeys(mode, off){
  const today = new Date(); today.setHours(0,0,0,0);
  let start, end, label;
  if(mode==='tag'){ start = new Date(today); start.setDate(start.getDate()+off); end = new Date(start); label = dstr(dayKey(start)); }
  else if(mode==='woche'){
    start = new Date(today); start.setDate(start.getDate()-((start.getDay()+6)%7)+off*7); end = new Date(start); end.setDate(end.getDate()+6);
    label = 'KW ' + kw(start) + ' · ' + start.getDate()+'.'+(start.getMonth()+1)+'. – '+end.getDate()+'.'+(end.getMonth()+1)+'.';
  } else {
    start = new Date(today.getFullYear(), today.getMonth()+off, 1); end = new Date(start.getFullYear(), start.getMonth()+1, 0);
    label = MONATE[start.getMonth()] + ' ' + start.getFullYear();
  }
  const keys = []; for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) keys.push(dayKey(d));
  return { keys, label, fname: mode==='monat' ? MONATE[start.getMonth()]+'_'+start.getFullYear() : dayKey(start) };
}
function kw(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/86400000+1)/7); }

function csv(rows){ return '﻿' + rows.map(r => r.map(c => { c = String(c==null?'':c); return /[;"\n\r]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(';')).join('\r\n'); }
const decN = ms => (Math.max(0,ms)/3600000).toFixed(2).replace('.',',');
function csvAuftraege(keys){
  // Aufträge aus dem Zeitraum, jeweils mit allen Zeiten über alle Tage
  const inRange = new Set(summarize(keys, Date.now()).per.map(g => aKey(g.a)));
  const all = summarize(Object.keys(state.days), Date.now());
  const s = { per: all.per.filter(g => inRange.has(aKey(g.a))) };
  const rows = [['Auftrags-Nr.','Produkt','EIN','Art','Bezeichnung','Zeit (h:mm)','Zeit (Std. dezimal)','Minuten']];
  s.per.forEach(g => {
    rows.push([g.a.nr, g.a.produkt, aLive(g.a).ein||'', 'Arbeitszeit gesamt', '', dur(g.own), decN(g.own), Math.round(g.own/60000)]);
    Object.entries(g.masch).forEach(([m,v]) => rows.push([g.a.nr, g.a.produkt, aLive(g.a).ein||'', 'Maschinenzeit', m, dur(v), decN(v), Math.round(v/60000)]));
    Object.entries(g.taet).forEach(([t,v]) => rows.push([g.a.nr, g.a.produkt, aLive(g.a).ein||'', 'Tätigkeit', t, dur(v), decN(v), Math.round(v/60000)]));
  });
  return csv(rows);
}
function csvBuchungen(keys){
  const now = Date.now();
  const rows = [['Datum','Start','Ende','Auftrags-Nr.','Produkt','EIN','Arbeitsablauf','Schritt','Tätigkeit','Maschine','Vorbereitung','Pause (min)','Dauer (h:mm)','Dauer (Std. dezimal)','Maschinenzeit (h:mm)','Notiz']];
  keys.forEach(k => Object.values(state.days[k]||{}).sort((a,b)=>a.s-b.s).forEach(e => {
    const d = entryDur(e, now);
    rows.push([parseDay(k).toLocaleDateString('de-DE'), hm(e.s), e.e?hm(e.e):'läuft', e.a.nr, e.a.produkt, aLive(e.a).ein||'', e.ab?e.ab.n:'', e.ab?(e.ab.i+1)+'/'+e.ab.of:'',
      e.t, e.m, e.vb ? 'ja' : '', e.fx ? '' : Math.round(d.pause/60000), e.fx ? '' : dur(d.work), e.fx ? '' : decN(d.work), e.fx ? dur((+e.mt||0)*60000) : e.m ? dur((e.vb ? 0 : e.mz != null ? +e.mz*60000 : d.work)) : '', (e.note||'').replace(/\s+/g,' ')]);
  }));
  return csv(rows);
}

/* =================== Oberfläche =================== */
const WT_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const view = document.getElementById('view');
let tab = 'stopp', aMode = 'tag', aOff = 0, bDay = dayKey(new Date()), einSub = null;
const openA = {};
const form = { mode:'task' };
const ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
const ICON_SEARCH = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="opacity:.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

/* ---------- Sheets ---------- */
function sheetOpen(){ return document.getElementById('L1').classList.contains('open'); }
function openSheet(n, o){
  const L = document.getElementById('L'+n), S = document.getElementById('S'+n);
  S.innerHTML = `<div class="grab"></div><div class="shead"><button class="l">${esc(o.left||'Abbrechen')}</button><b>${esc(o.title||'')}</b>${o.right?`<button class="r">${esc(o.right)}</button>`:'<span></span>'}</div><div class="sbody"></div>`;
  S.querySelector('.l').onclick = () => o.onLeft ? o.onLeft() : closeSheet(n);
  if(o.right) S.querySelector('.r').onclick = o.onRight;
  L.onclick = ev => { if(ev.target === L) S.querySelector('.l').click(); };
  S.scrollTop = 0; S.style.transform = '';
  requestAnimationFrame(() => { L.classList.add('open'); updateSheetDepth(); });
  enableSwipe(L, S);
  return S.querySelector('.sbody');
}
function closeSheet(n, noRender){
  const L = document.getElementById('L'+n), S = document.getElementById('S'+n);
  S.style.transform = ''; L.classList.remove('open'); updateSheetDepth();
  if(n===1 && !noRender) render();
}
// iOS-Effekt: Seite dahinter wird kleiner und rückt nach hinten
function updateSheetDepth(){
  const o1 = document.getElementById('L1').classList.contains('open'), o2 = document.getElementById('L2').classList.contains('open');
  document.body.classList.toggle('sheeted', o1 || o2);
  document.getElementById('S1').classList.toggle('behind', o1 && o2);
}
// Sheet nach unten wischen zum Schließen
function enableSwipe(L, S){
  if(S._swipe) return; S._swipe = true;
  let y0 = null, dy = 0, t0 = 0;
  S.addEventListener('touchstart', ev => {
    const inHead = ev.target.closest('.grab, .shead');
    if(!inHead && S.scrollTop > 0) return;
    if(ev.target.closest('input, textarea, select')) return;
    y0 = ev.touches[0].clientY; dy = 0; t0 = Date.now(); S.style.transition = 'none';
  }, { passive:true });
  S.addEventListener('touchmove', ev => {
    if(y0 === null) return;
    dy = ev.touches[0].clientY - y0;
    if(dy <= 0){ S.style.transform = ''; return; }
    if(S.scrollTop > 0 && !ev.target.closest('.grab, .shead')){ y0 = null; S.style.transition = ''; S.style.transform = ''; return; }
    S.style.transform = `translateY(${dy}px)`;
  }, { passive:true });
  S.addEventListener('touchend', () => {
    if(y0 === null) return;
    S.style.transition = '';
    const fast = dy > 60 && Date.now() - t0 < 250;
    if(dy > 140 || fast){ const l = S.querySelector('.shead .l'); if(l) l.click(); else S.style.transform = ''; }
    else S.style.transform = '';
    y0 = null;
  });
}

/* ---------- Auswahlliste (Picker) ---------- */
function pick(kind, cur, opt){
  opt = opt || {};
  return new Promise(res => {
    let q = '', finished = false;
    const finish = v => { if(finished) return; finished = true; closeSheet(2); res(v); };
    const titles = { auftrag:'Auftrag', taet:'Tätigkeit', masch:'Maschine', ab:'Arbeitsablauf' };
    const body = openSheet(2, { title: titles[kind], onLeft: () => finish(undefined), right: kind==='taet' ? 'Verwenden' : null, onRight: () => { if(q.trim()) finish(q.trim()); } });
    const useBtn = document.querySelector('#S2 .shead .r');
    body.innerHTML = `<div class="search">${ICON_SEARCH}<input id="pq" placeholder="${kind==='ab'?'Suchen':'Suchen oder neu eingeben'}" autocomplete="off"></div><div id="plist"></div>`;
    const items = () => kind==='auftrag'
      ? state.stamm.auftraege.filter(a => !a.done || a.id===cur).map(a => ({ v:a.id, l:aTitle(a), s:aSub(a), k:(a.nr+' '+a.produkt+' '+(a.ein||'')).toLowerCase() }))
      : kind==='ab' ? state.stamm.ablaeufe.map(a => ({ v:a.id, l:a.name, s:a.steps.map(x=>x.t).join(' → '), k:a.name.toLowerCase() }))
      : state.stamm[kind].map(x => ({ v:x.name, l:x.name, s: kind==='masch' && x.fix ? 'feste Zeit, ohne Zeitmessung' : '', k:x.name.toLowerCase() }));
    const row = (v, l, s, on, nr) => `<button class="cell" data-v="${esc(v)}"><span class="cl two"><span class="${nr?'nr':''}">${esc(l)}</span>${s?`<small>${esc(s)}</small>`:''}</span>${on?'<span class="check">✓</span>':''}</button>`;
    const plist = body.querySelector('#plist');
    const draw = () => {
      const ql = q.trim().toLowerCase();
      const all = items(), list = all.filter(i => !ql || i.k.includes(ql));
      let h = '';
      if(opt.none && !ql) h += `<div class="sect"><div class="group">${row('', opt.none, '', !cur)}</div></div>`;
      if(list.length) h += `<div class="sect"><div class="group">${list.map(i => row(i.v, i.l, i.s, i.v===cur, i.nr)).join('')}</div></div>`;
      else if(!ql) h += `<div class="empty">${kind==='ab' ? 'Noch keine Arbeitsabläufe – lege sie unter „Verwalten“ an.' : 'Noch keine Einträge – tippe oben etwas ein.'}</div>`;
      const exact = all.some(i => kind==='auftrag' ? i.l.toLowerCase()===ql : i.k===ql);
      if(kind!=='ab' && ql && !exact) h += `<div class="group"><button class="cell accent" data-add>＋ „${esc(q.trim())}“ hinzufügen</button></div>${kind==='taet' ? '<div class="foot">Oben rechts „Verwenden“: nur dieses Mal buchen, ohne in der Liste zu speichern.</div>' : ''}`;
      plist.innerHTML = h;
      plist.querySelectorAll('[data-v]').forEach(b => b.onclick = () => finish(b.dataset.v));
      const add = plist.querySelector('[data-add]');
      if(add) add.onclick = () => kind==='auftrag' ? addAuftrag(q.trim()) : finish(ensureName(kind, q));
      if(useBtn){ const on = !!ql && !exact; useBtn.style.visibility = on ? 'visible' : 'hidden'; }
    };
    const addAuftrag = nr => {
      plist.innerHTML = `<div class="sect"><h2>Neuer Auftrag</h2><div class="group">
<label class="cell"><span>Name</span><input id="na-pr" value="${esc(/^[\d\s\-\/.]+$/.test(nr) ? '' : nr)}" placeholder="Produktname" style="flex:1"></label>
        <label class="cell"><span>Auftrags-Nr.</span><input id="na-nr" value="${esc(/^[\d\s\-\/.]+$/.test(nr) ? nr : '')}" style="flex:1"></label>
        <label class="cell"><span>EIN</span><input id="na-ein" value="${esc('')}" style="flex:1"></label></div></div>
        <button class="cta blue" id="na-ok">Hinzufügen</button>`;
      document.getElementById('na-pr').focus();
      document.getElementById('na-ok').onclick = () => {
        if(!document.getElementById('na-pr').value.trim()) return toast('Name fehlt');
        const a = ensureAuftrag(document.getElementById('na-nr').value, document.getElementById('na-pr').value, document.getElementById('na-ein').value);
        if(!a) return toast('Name fehlt');
        finish(a.id);
      };
    };
    body.querySelector('#pq').oninput = ev => { q = ev.target.value; draw(); };
    draw();
  });
}

/* ---------- Starten / Stoppen ---------- */
let fsMin = false; // Vollbild minimiert?
const aFind = x => x && state.stamm.auftraege.find(a => a.nr===x.nr && a.produkt===x.produkt);

let fsRun = null; // welche laufende Aufgabe im Vollbild gezeigt wird
// Aufgabe anhalten und Position am Auftrag merken
function suspendRun(r, now){
  const e = runEntry(r), A = e ? aFind(e.a) : null;
  if(A){ A.resume = r.ab ? { ab: clone(r.ab) } : { t:e.t, m:e.m||'' }; A.resumeAt = now; persist('stamm'); }
  stopRun(r, now);
}
function runsOf(A){ return runs().filter(r => { const e = runEntry(r); return e && aFind(e.a) === A; }); }
function stopRunsOf(A, now){ runsOf(A).forEach(r => stopRun(r, now)); }
function afterRunEnd(){ fsRun = null; fsMin = runs().length > 0; }
const freshA = A => A && (state.stamm.auftraege.find(x => x.id === A.id) || A);
function reactivate(A){ A = freshA(A); if(A && A.done){ A.done = false; delete A.doneAt; persist('stamm'); } }
function clearResume(A){ A = freshA(A); if(A && A.resume){ delete A.resume; delete A.resumeAt; persist('stamm'); } }

function startTaskFor(A, t, m, vb, fxMin){
  A = freshA(A);
  if(m && isFixM(m)){
    const mt = Math.round(+fxMin || 0);
    if(mt <= 0){ toast('Bitte feste Zeit in Minuten eingeben'); return false; }
    bookFixed(A, m, t, null, Date.now(), mt); buzz(); toast('⚙︎ ' + m + ': ' + dur(mt*60000) + ' gebucht'); render(); return true;
  }
  if(!t){ toast('Bitte Tätigkeit wählen'); return false; }
  const now = Date.now(); stopRunsOf(A, now); clearResume(A); reactivate(A);
  fsRun = startEntry(A, t, m, null, now, vb).eid;
  if(!vb){ state.stamm.last = Object.assign(state.stamm.last||{}, { a:A.id, t, m:m||'' }); persist('stamm'); }
  fsMin = false; buzz(); toast('▶︎ ' + t); return true;
}
function startAblaufFor(A, def, fromIdx){
  A = freshA(A);
  if(!def.steps.length){ toast('Arbeitsablauf hat keine Schritte'); return false; }
  const now = Date.now(); stopRunsOf(A, now); clearResume(A); reactivate(A);
  const ab = { id:def.id, name:def.name, steps:clone(def.steps), idx: fromIdx||0, done: Array.isArray(def.done) ? clone(def.done) : [...Array(fromIdx||0).keys()], a:{ nr:A.nr, produkt:A.produkt }, sid: uid() };
  state.stamm.last = Object.assign(state.stamm.last||{}, { a:A.id, ab:def.id }); persist('stamm');
  const r = runAblaufFrom(ab, now);
  if(!r){ afterRunEnd(); buzz(); render(); doneAsk(freshA(A), 'Arbeitsablauf abgeschlossen'); return true; }
  fsRun = r.eid;
  fsMin = false; buzz(); toast(fromIdx ? '▶︎ Fortgesetzt bei Schritt ' + (fromIdx+1) : '▶︎ ' + def.name); return true;
}
function resumeFor(A){
  const r = A.resume; if(!r) return false;
  if(r.ab) return startAblaufFor(A, r.ab, r.ab.idx);
  return startTaskFor(A, r.t, r.m);
}
/* ---------- Maschinen mit fester Buchungszeit ---------- */
// feste Minuten einer Maschine (0 = normale Maschine mit Zeitmessung)
function isFixM(name){ const x = name && state.stamm.masch.find(m => m.name === name); return !!(x && x.fix); }
// Minuten-Feld für feste Maschinen (Einzelaufgabe / Nächste Aufgabe)
const fxCell = (f) => isFixM(f.m) ? `<label class="cell"><span class="cl two"><span>Feste Zeit</span><small>wird ohne Stoppuhr gebucht</small></span><input type="number" id="fx-mt" min="1" inputmode="numeric" placeholder="0" value="${f.mt || ''}" style="width:70px"><span class="dim">min</span></label>` : '';
// feste Maschinenzeit buchen: keine Arbeitszeit, nur Maschinenzeit
function bookFixed(a, m, t, ab, now, mt){
  const day = dayKey(new Date(now));
  const e = { id: uid(), a:{ nr:a.nr, produkt:a.produkt }, t: t || 'Maschinenbuchung', m, s: now, e: now, p: [], note:'', fx: true, mt: Math.max(0, Math.round(+mt || 0)) };
  if(ab) e.ab = { n: ab.name, i: ab.idx, of: ab.steps.length, sid: ab.sid || '' };
  state.days[day] = state.days[day] || {};
  state.days[day][e.id] = e; persist('d-'+day);
  const A = aFind(e.a); if(A) reactivate(A);
  return e;
}
// Arbeitsablauf ab ab.idx weiterführen: Schritte mit fester Maschinenzeit werden sofort gebucht
function runAblaufFrom(ab, now){
  if(ab.idx >= ab.steps.length) return null;
  const s = ab.steps[ab.idx];
  const r = startEntry(ab.a, s.t, s.m, ab, now, isFixM(s.m) ? false : s.vb);
  // Schritt mit fester Maschinenzeit: wartet auf Bestätigung, keine Zeitmessung
  if(isFixM(s.m)){ const e = runEntry(r); e.fxp = true; e.mt = +s.mt || 0; persist('d-'+r.day); }
  return r;
}
// nächsten offenen Schritt suchen: zuerst nach dem aktuellen, dann von vorne
function normDone(ab){ if(!Array.isArray(ab.done)) ab.done = [...Array(ab.idx||0).keys()]; return ab.done; }
function nextOpen(ab, from){
  const d = normDone(ab), n = ab.steps.length;
  for(let i = from + 1; i < n; i++) if(!d.includes(i)) return i;
  for(let i = 0; i < n; i++) if(!d.includes(i)) return i;
  return -1;
}
function markStepDone(ab){ normDone(ab); if(!ab.done.includes(ab.idx)) ab.done.push(ab.idx); }
// auf einen Schritt tippen: dorthin springen (bisherige Zeit bleibt gebucht, Schritt bleibt offen)
function jumpStep(r, i){
  if(!r || !r.ab || i === r.ab.idx) return;
  const now = Date.now(), ab = clone(r.ab);
  const e = runEntry(r);
  if(e && e.fxp){ delete state.days[r.day][r.eid]; persist('d-'+r.day); state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv'); }
  else stopRun(r, now);
  ab.done = normDone(ab).filter(x => x !== i);
  ab.idx = i;
  const nr = runAblaufFrom(ab, now);
  fsRun = nr.eid; buzz(); toast('→ Schritt ' + (i+1) + ': ' + ab.steps[i].t); render();
}
function advance(ab, now, msg){
  markStepDone(ab);
  const ni = nextOpen(ab, ab.idx);
  if(ni < 0){ const A = aFind(ab.a); clearResume(A); afterRunEnd(); buzz(); render(); doneAsk(A, 'Arbeitsablauf abgeschlossen'); return; }
  ab.idx = ni;
  const nr = runAblaufFrom(ab, now);
  fsRun = nr.eid; buzz(); toast(msg + ab.steps[ni].t); render();
}
// festen Schritt bestätigen: Zeit buchen und zum nächsten Schritt
function confirmFixed(r, mt){
  const e = runEntry(r); if(!e || !e.fxp) return;
  mt = Math.round(+mt || 0);
  if(mt <= 0) return toast('Bitte Minuten eingeben');
  const now = Date.now(), ab = clone(r.ab);
  delete e.fxp; e.fx = true; e.mt = mt; e.s = now; e.e = now; persist('d-'+r.day);
  state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv');
  advance(ab, now, '⚙︎ ' + dur(mt*60000) + ' gebucht → ');
}
function nextStep(r){
  if(!r || !r.ab) return;
  const now = Date.now(), ab = clone(r.ab);
  stopRun(r, now);
  advance(ab, now, 'Weiter: ');
}
function skipStep(r){
  if(!r || !r.ab) return;
  const now = Date.now(), ab = clone(r.ab);
  if(state.days[r.day]) delete state.days[r.day][r.eid];
  persist('d-'+r.day);
  state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv');
  advance(ab, now, 'Übersprungen → ');
}
// Einzelne Aufgabe: direkt zur nächsten Tätigkeit am selben Auftrag
function nextTaskSheet(r){
  const e = runEntry(r); if(!e) return;
  const A = aFind(e.a) || ensureAuftrag(e.a.nr, e.a.produkt);
  const f = { t:'', m:'' };
  const body = openSheet(1, { title:'Nächste Aufgabe' });
  const draw = () => {
    body.innerHTML = `<div class="subttl" style="text-align:center;margin-top:-8px">${esc(aOne(A))} · bisher: ${esc(e.t)}</div>
      <div class="sect"><div class="group">${pickCell('t','Tätigkeit',esc(f.t),'Wählen')}${pickCell('m','Maschine',esc(f.m),'Ohne')}${fxCell(f)}</div></div>
      <button class="cta blue" id="go">${isFixM(f.m) ? '⚙︎ Feste Zeit buchen' : 'Weiter'}</button>
      ${isFixM(f.m) ? '<div class="foot" style="text-align:center">Deine laufende Aufgabe läuft dabei weiter.</div>' : ''}`;
    const fm = body.querySelector('#fx-mt'); if(fm) fm.oninput = () => { f.mt = fm.value; };
    body.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => {

      if(v !== undefined){ f[k] = v; draw(); }
    });
    body.querySelector('#go').onclick = () => { if(startTaskFor(A, f.t, f.m, false, f.mt)) closeSheet(1); };
  };
  draw();
}
// Vorbereitungszeit während des Stempelns an/aus: ab jetzt neuer Abschnitt
function toggleVb(r){
  const e = runEntry(r); if(!e) return;
  const now = Date.now(), wasPaused = isPaused(e), vb = !e.vb;
  if(now - e.s < 60000 && !(e.p||[]).length){ if(vb) e.vb = true; else delete e.vb; persist('d-'+r.day); buzz(); render(); return; }
  stopRun(r, now);
  const nr = startEntry(e.a, e.t, e.m, r.ab, now, vb);
  if(wasPaused){ const ne = runEntry(nr); ne.p.push([now, null]); persist('d-'+nr.day); }
  fsRun = nr.eid; buzz(); toast(vb ? 'Vorbereitungszeit an' : 'Vorbereitungszeit aus'); render();
}
// Fertig-Knopf: Zeit stoppen und Auftrag fertig melden
function doneRun(r, keepOpen, fxMin){
  const e = runEntry(r); if(!e) return;
  if(e.fxp){ const mt = Math.round(+(fxMin != null ? fxMin : e.mt) || 0);
    if(mt > 0){ const now0 = Date.now(); delete e.fxp; e.fx = true; e.mt = mt; e.s = now0; e.e = now0; persist('d-'+r.day); state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv'); } }
  const A = aFind(e.a), now = Date.now();
  stopRun(r, now); if(A){ stopRunsOf(A, now); clearResume(A); }
  if(keepOpen){ afterRunEnd(); buzz(); toast('Gestoppt – ' + aTitle(e.a) + ' bleibt offen'); render(); return; }
  markDone(A); afterRunEnd(); render();
}
// Fertig-Knopf: erst fragen, ob der Auftrag fertig ist oder offen bleibt
function doneChoice(r){
  const e = runEntry(r); if(!e) return;
  const inp = document.getElementById('fxc'), fxMin = inp ? inp.value : null;
  const body = openSheet(1, { title:'Aufgabe beenden' });
  body.innerHTML = `<div class="subttl" style="text-align:center;margin-top:-8px">${esc(aOne(e.a))}</div>
    <div class="sect"><div class="group">
      <button class="cell" id="dc-yes"><span class="icon" style="background:var(--green)">✓</span><span class="cl two"><span>Auftrag fertig melden</span><small>Wird aus der Auswahl ausgeblendet</small></span></button>
      <button class="cell" id="dc-no"><span class="icon" style="background:var(--blue)">#</span><span class="cl two"><span>Auftrag bleibt offen</span><small>Zeit stoppen – es kommen noch weitere Arbeiten</small></span></button>
    </div></div>`;
  body.querySelector('#dc-yes').onclick = () => { closeSheet(1, true); doneRun(r, false, fxMin); };
  body.querySelector('#dc-no').onclick = () => { closeSheet(1, true); doneRun(r, true, fxMin); };
}
// Pause gedrückt halten: alle Zeiten dieser Stempelung löschen
function discardRun(r){
  if(!runEntry(r)) return;
  const sid = r.ab && r.ab.sid, del = [];
  if(sid){ for(const d in state.days) for(const x of Object.values(state.days[d])) if(x.ab && x.ab.sid === sid) del.push([d, x.id]); }
  else del.push([r.day, r.eid]);
  state.aktiv = runs().filter(x => x.eid !== r.eid); persist('aktiv');
  del.forEach(([d, id]) => { delete state.days[d][id]; });
  [...new Set(del.map(x => x[0]))].forEach(d => persist('d-'+d));
  try{ navigator.vibrate && navigator.vibrate([30,60,30]); }catch(e){}
  afterRunEnd(); toast('Verworfen – ' + (del.length > 1 ? del.length + ' Zeiten' : 'Zeit') + ' gelöscht'); render();
}
function markDone(A){
  A = freshA(A);
  if(!A) return;
  A.done = true; A.doneAt = Date.now(); delete A.resume; delete A.resumeAt; persist('stamm');
  buzz(); toast('✓ ' + aTitle(A) + ' fertig gemeldet');
  const id = A.id; setTimeout(() => doneSummary(id), 400);
}
// Zusammenfassung beim Fertigmelden: alle Zeiten des Auftrags
function doneSummary(id){
  const A = state.stamm.auftraege.find(x => x.id === id); if(!A) return;
  const s = summarize(Object.keys(state.days), Date.now());
  const g = s.per.find(x => aKey(x.a) === aKey(A));
  const body = openSheet(1, { title:'Auftrag fertig ✓', left:'Schließen' });
  if(!g){ body.innerHTML = `<div class="subttl" style="text-align:center">${esc(aOne(A))}</div><div class="group"><div class="empty">Keine Zeiten gebucht.</div></div>`; return; }
  const ms = Object.entries(g.masch).sort((a,b) => b[1]-a[1]);
  body.innerHTML = `<div style="text-align:center;margin:-6px 0 18px"><div style="font-size:24px;font-weight:700">${esc(aTitle(A))}</div>${aSub(A) ? `<div class="dim" style="font-size:15px;margin-top:2px">${esc(aSub(A))}</div>` : ''}</div>
    <div class="sect"><div class="group">
      <div class="cell"><span class="icon" style="background:var(--blue)"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg></span><span class="cl">Meine Arbeitszeit</span>${timeVal(g.own)}</div>
      ${ms.map(([m,v]) => `<div class="cell"><span class="icon" style="background:var(--orange)">⚙︎</span><span class="cl">${esc(m)}</span>${timeVal(v)}</div>`).join('')}
    </div><div class="foot">Alle Zeiten, die auf diesen Auftrag gebucht wurden.</div></div>
    <button class="cta blue" id="dscopy">Zeiten kopieren</button>`;
  body.querySelector('#dscopy').onclick = () => {
    const mt = ms.map(([m,v]) => `  ${m}: ${dur(v)} (${dec(v)})`).join('\n');
    copyText(`${aOne(A)}\nArbeitszeit: ${dur(g.own)} (${dec(g.own)})` + (mt ? `\nMaschinenzeiten:\n${mt}` : ''));
  };
}
// Stopp-Knopf: unterbrechen oder fertig melden
function stopSheet(r){
  const e = runEntry(r); if(!e) return;
  const A = aFind(e.a), ab = r.ab;
  const body = openSheet(1, { title:'Stoppen' });
  body.innerHTML = `<div class="subttl" style="text-align:center;margin-top:-8px">${esc(aOne(e.a))}</div>
    <div class="sect"><div class="group">
      <button class="cell" id="s-pause"><span class="icon" style="background:var(--orange)">❚❚</span><span class="cl two"><span>Unterbrechen</span><small>${ab ? `Später bei Schritt ${ab.idx+1} „${esc(ab.steps[ab.idx].t)}“ fortsetzen` : 'Später an dieser Stelle fortsetzen'}</small></span></button>
      <button class="cell" id="s-done"><span class="icon" style="background:var(--green)">✓</span><span class="cl two"><span>Auftrag fertig melden</span><small>Zeit stoppen und Auftrag abschließen</small></span></button>

}

function resumeText(r){

    bindBack(abList);
    body.querySelector('#go').onclick = () => { if(startAblaufFor(A, def)) closeSheet(1); };
  };

  home();
}

function newAuftragSheet(prefill){

<label class="cell"><span>Name</span><input id="na-pr" value="${esc(digits ? '' : prefill || '')}" placeholder="Produktname" style="flex:1"></label>

  }
}

/* ---------- Tab: Stempeln ---------- */
let aQuery = '', stOpen = { aktiv:true, gestoppt:true, fertig:false };
function lastUse(){
  const m = {};
  for(const d in state.days) for(const e of Object.values(state.days[d])){ const k = aKey(e.a); if(!m[k] || e.s > m[k]) m[k] = e.s; }
  return m;
}
function agoText(ts){
  if(!ts) return '';
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const days = Math.round((d0 - new Date(ts).setHours(0,0,0,0)) / 86400000);
  return days <= 0 ? 'heute' : days === 1 ? 'gestern' : 'vor ' + days + ' Tagen';
}
function renderStopp(){
  const rs = runs();
  if(!fsMin && rs.length){
    const r = findRun(fsRun) || (rs.length === 1 ? rs[0] : null);
    if(r){ fsRun = r.eid; return renderRunning(r); }
  }
  const d0 = new Date();
  view.innerHTML = `<div class="nav"><span></span><button class="round glass" id="addA" aria-label="Neuer Auftrag">＋</button></div><div class="ttl">Stempeln</div><div class="subttl">${WT_LONG[d0.getDay()]}, ${d0.getDate()}. ${MONATE[d0.getMonth()]}</div>
    <div class="sect">
    <div class="search glass" style="border-radius:14px">${ICON_SEARCH}<input id="aq" placeholder="Name, Auftrags-Nr. oder EIN suchen" autocomplete="off" value="${esc(aQuery)}"><button class="sclear ${aQuery?'':'hid'}" id="aqx" aria-label="Suche leeren">✕</button></div>
    <div id="alist"></div></div>`;
  const aq = document.getElementById('aq'), aqx = document.getElementById('aqx');
  aq.oninput = ev => { aQuery = ev.target.value; aqx.classList.toggle('hid', !aQuery); drawAList(); };
  aqx.onclick = () => { aQuery = ''; aq.value = ''; aqx.classList.add('hid'); drawAList(); };
  document.getElementById('addA').onclick = () => newAuftragSheet(aQuery.trim());

}
function drawAList(){
  const el = document.getElementById('alist'); if(!el) return;
  const lu = lastUse(), ql = aQuery.trim().toLowerCase();
  const runBy = {}; runs().forEach(r => { runBy[aKey(runEntry(r).a)] = r; });
  const match = a => !ql || (a.nr + ' ' + a.produkt + ' ' + (a.ein||'')).toLowerCase().includes(ql);
  const byUse = (x,y) => (lu[aKey(y)]||0) - (lu[aKey(x)]||0) || aTitle(x).localeCompare(aTitle(y), 'de', { numeric:true });
  const all = state.stamm.auftraege.filter(match);
  const isRun = a => !!runBy[aKey(a)];
  const isPausedRun = a => isRun(a) && isPaused(runEntry(runBy[aKey(a)]));
  const isLive = a => isRun(a) && !isPausedRun(a);
  const fresh = all.filter(a => !a.done && !a.resume && !isRun(a)).sort(byUse);
  const groups = [
    { k:'aktiv', t:'Aktiv', c:'var(--blue)', list: all.filter(a => !a.done && isLive(a)).sort(byUse), empty:'Keine aktiven Aufträge.' },
    { k:'gestoppt', t:'Gestoppt', c:'var(--orange)', list: all.filter(a => !a.done && (isPausedRun(a) || (!isRun(a) && a.resume))).sort((x,y) => isPausedRun(y) - isPausedRun(x) || (y.resumeAt||0) - (x.resumeAt||0)), empty:'Keine gestoppten Aufträge.' },
    { k:'fertig', t:'Fertig', c:'var(--green)', list: all.filter(a => a.done).sort((x,y) => (y.doneAt||0) - (x.doneAt||0)), empty:'Noch nichts fertig gemeldet.' },
  ];
  const cell = a => {
    const run = isRun(a);
    const pr = isPausedRun(a);
    const icon = a.done ? ['var(--green)','✓'] : pr ? ['var(--orange)','❚❚'] : run ? ['var(--green)','▶︎'] : a.resume ? ['var(--orange)','❚❚'] : ['var(--blue)','#'];
    const rE = run ? runEntry(runBy[aKey(a)]) : null;
    const sub = esc(aSub(a)) + (pr ? ` · pausiert · ${esc(rE.t)}` : '') + (a.resume && !run && !a.done && a.resume.ab ? ` · Schritt ${a.resume.ab.idx+1}/${a.resume.ab.steps.length}: ${esc(a.resume.ab.steps[a.resume.ab.idx].t)}` : a.resume && !run && !a.done ? ` · ${esc(a.resume.t)}` : '');
    const right = a.done ? (a.doneAt ? agoText(a.doneAt) : '') : run && rE && rE.fxp ? '<span style="color:var(--orange)">bestätigen</span>' : run ? `<span style="color:${pr?'var(--orange)':'var(--green)'}" class="tnum" data-live="${runBy[aKey(a)].eid}">${dur(entryDur(runEntry(runBy[aKey(a)]), Date.now()).work, true)}</span>` : agoText(a.resume ? a.resumeAt : lu[aKey(a)]);
    return `<button class="cell" data-auf="${a.id}"><span class="icon" style="background:${icon[0]}">${icon[1]}</span>
      <span class="cl two"><span style="font-weight:600">${esc(aTitle(a))}</span><small>${sub}</small></span>
      <span class="cv" style="font-size:14px">${right}</span><span class="chev">›</span></button>`;

/* ---------- Ausbildungsbericht ---------- */
// Geschlecht der Maschine schätzen (für der/dem). Typbezeichnungen wie "B240" oder "MultiStrip" -> "die Maschine" = weiblich
function machGender(m){
  const w = m.trim().split(/\s+/).pop(), l = w.toLowerCase();
  if(/\d/.test(w) || /[A-Z]/.test(w.slice(1))) return 'f';
  if(/(kolben|ofen|automat|roboter|tisch|stand|platz|raum|bohrer|laser|schrank|kompressor|lötkolben|drucker|schneider)$/.test(l)) return 'm';
  if(/(gerät|werkzeug|bad|becken|lager|zentrum)$/.test(l)) return 'n';
  return 'f';
}
const V_IN  = /(sandstrahl|strahlen|wasch|reinig|trockn|härt|lackier|einbrenn|vergieß|vergiess|tauch|spül|beschicht)/;
const V_AN  = /(zuschneid|ablängen|abläng|schneid|säg|bohr|fräs|dreh|schleif|entgrat|bieg|stanz|montier|bedien|einricht|rüst|schweiß|schweiss|programmier|ausformen|entform)/;
const M_IN  = /(anlage|kabine|ofen|raum|bad|becken|schrank|strahler|kammer)$/i;
const M_AN  = /(station|bank|platz|tisch|maschine|presse|säge|fräse|drehbank)$/i;
// Vorschlag für neue Maschinen: "an der …", "mit dem …", "in der …" (danach frei änderbar)
function defaultPhrase(m){
  const g = machGender(m), n = m.trim();
  const prep = M_IN.test(n) ? 'in' : M_AN.test(n) ? 'an' : 'mit';
  const art = prep === 'in' ? (g === 'f' ? 'in der' : 'im') : prep === 'an' ? (g === 'f' ? 'an der' : 'am') : (g === 'f' ? 'mit der' : 'mit dem');
  return art + ' ' + n;
}
// fest eingetragene Formulierung der Maschine
function machPhrase(m){
  const x = state.stamm.masch.find(y => y.name === m);
  return (x && x.rp && x.rp.trim()) || defaultPhrase(m);
}
// allen Maschinen ohne Formulierung einmal eine eintragen
function ensurePhrases(){
  let ch = false;
  (state.stamm.masch || []).forEach(x => { if(!x.rp){ x.rp = defaultPhrase(x.name); ch = true; } });
  if(ch) persist('stamm');
}
// Tätigkeit + Maschine als Satz: Maschine vor das Verb am Ende, sonst dahinter
function reportPhrase(t, m){
  t = (t || '').trim(); if(!m) return t;
  const p = machPhrase(m), w = t.split(/\s+/), last = w[w.length-1], ll = last.toLowerCase();
  // kleingeschriebenes Wort am Ende = Verb; großgeschrieben nur, wenn es ein bekanntes Arbeitsverb ist (z. B. "Sandstrahlen")
  const isVerb = /(en|ern|eln)$/.test(ll) && (/^[a-zäöü]/.test(last) || /^(sand)?strahlen$|^(ab)?(waschen|reinigen|trocknen|härten|lackieren|drehen|fräsen|bohren|schleifen|sägen|entgraten|crimpen|löten|verlöten|verzinnen|abisolieren|zuschneiden|ablängen|biegen|stanzen|schweißen|prüfen|messen|pressen|montieren)$/.test(ll));
  if(w.length >= 2 && isVerb) return w.slice(0, -1).join(' ') + ' ' + p + ' ' + last;
  return t + ' ' + p;
}
function reportText(keys){
  const now = Date.now(), out = [];
  keys.forEach(k => {
    const d = state.days[k]; if(!d) return;
    const groups = {};
    Object.values(d).filter(e => !e.fx && !e.fxp && !(e.m && isFixM(e.m))).sort((a,b) => a.s - b.s).forEach(e => {
      const key = (e.t||'').trim().toLowerCase() + '|' + (e.m||'');
      const g = groups[key] = groups[key] || { t:e.t, m:e.m, ms:0 };
      g.ms += entryDur(e, now).work;
    });
    const lines = Object.values(groups).filter(g => g.ms >= 10*60000).map(g => {
      const h = Math.max(0.5, Math.round(g.ms / 1800000) / 2);
      return '-' + reportPhrase(g.t, g.m) + ' ' + String(h).replace('.', ',') + 'h';
    });
    if(lines.length) out.push(WT_LONG[parseDay(k).getDay()] + ':\n' + lines.join('\n'));
  });
  return out.join('\n');
}
function reportSheet(r){
  const txt = reportText(r.keys);
  const body = openSheet(1, { title:'Ausbildungsbericht', left:'Fertig' });
  body.innerHTML = `<div class="subttl" style="text-align:center;margin-top:-8px">${esc(r.label)}</div>
    ${txt ? `<div class="group"><div class="cell"><textarea id="rtxt" style="font-size:15px;line-height:1.45;overflow:hidden">${esc(txt)}</textarea></div></div>
      <div class="foot" style="margin-bottom:16px">Du kannst den Text hier noch ändern. Maschinen mit fester Zeit und Aufgaben unter 10 Minuten sind weggelassen, Zeiten auf halbe Stunden gerundet.</div>
      <button class="cta blue" id="rcopy">Kopieren</button>`
    : '<div class="group"><div class="empty">Keine passenden Tätigkeiten in diesem Zeitraum.</div></div>'}`;
  const ta = body.querySelector('#rtxt');
  if(ta){ const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }; ta.oninput = fit; requestAnimationFrame(fit); }
  const c = body.querySelector('#rcopy'); if(c) c.onclick = () => copyText(body.querySelector('#rtxt').value, body.querySelector('#rtxt'));
}


/* ---------- Auftragssuche & Datumsauswahl (Auswertung) ---------- */
// Auswertung auf ein bestimmtes Datum setzen (Tag, Woche oder Monat, in dem es liegt)
function gotoDate(k, mode){
  aMode = mode || aMode;
  const t = new Date(); t.setHours(0,0,0,0); const d = parseDay(k);
  if(aMode === 'tag') aOff = Math.round((d - t) / 86400000);
  else if(aMode === 'woche'){ const ws = x => { const y = new Date(x); y.setDate(y.getDate() - ((y.getDay()+6)%7)); return y; }; aOff = Math.round((ws(d) - ws(t)) / (7*86400000)); }
  else aOff = (d.getFullYear() - t.getFullYear())*12 + d.getMonth() - t.getMonth();
}

function orderSheet(A){

    <div class="ttl">${LISTS[k].t}</div><div class="subttl"></div>${list}`;
  document.getElementById('back').onclick = () => { einSub = null; navAnim = 'pop'; render(); };

}
function editItem(k, id){
  const st = state.stamm, isA = k==='auftraege';
  const x = id ? st[k].find(y => y.id===id) : null;
  let armed = false;
  const body = openSheet(1, { title: x ? (isA ? 'Auftrag' : ({taet:'Tätigkeit',masch:'Maschine'}[k])) : 'Neu', right:'Sichern', onRight: save });
  body.innerHTML = isA
    ? `<div class="sect"><div class="group">
<label class="cell"><span>Name</span><input id="ei-pr" value="${esc(x?x.produkt:'')}" placeholder="Produktname" style="flex:1"></label>
        <label class="cell"><span>Auftrags-Nr.</span><input id="ei-nr" value="${esc(x?x.nr:'')}" style="flex:1"></label>
        <label class="cell"><span>EIN</span><input id="ei-ein" value="${esc(x&&x.ein?x.ein:'')}" style="flex:1"></label></div></div>
      ${x ? `<div class="sect"><div class="group"><label class="cell"><span class="cl">Fertig gemeldet</span><input type="checkbox" class="sw" id="ei-done" ${x.done?'checked':''}></label></div></div>` : ''}`
    : `<div class="sect"><div class="group"><label class="cell"><input class="left" id="ei-n" value="${esc(x?x.name:'')}" placeholder="Name"></label></div>
       ${x ? '<div class="foot">Umbenennen ändert nur künftige Buchungen.</div>' : ''}</div>
       ${k==='masch' ? `<div class="sect"><div class="group">
         <label class="cell"><span class="cl two"><span>Feste Zeit buchen</span><small>Keine Zeitmessung, keine Arbeitszeit</small></span><input type="checkbox" class="sw" id="ei-fx" ${x && x.fix ? 'checked' : ''}></label>
         <label class="cell"><span class="cl two"><span>Im Ausbildungsbericht</span><small>so steht es im Bericht, z. B. „an der …“</small></span><input id="ei-rp" value="${esc(x ? (x.rp || defaultPhrase(x.name)) : '')}" placeholder="z. B. an der Maschine" style="flex:1;min-width:0"></label>
       </div><div class="foot">Die Zeit legst du pro Arbeitsablauf-Schritt fest oder gibst sie bei einer einzelnen Aufgabe ein. Sie wird ohne Stoppuhr als Maschinenzeit gebucht.</div></div>` : ''}`;
  if(x) body.insertAdjacentHTML('beforeend', `<div class="group"><button class="cell danger" id="ei-del">Löschen</button></div>`);
  function save(){
    if(isA){
      const nr = document.getElementById('ei-nr').value.trim(), pr = document.getElementById('ei-pr').value.trim(), ein = document.getElementById('ei-ein').value.trim();
      if(!pr) return toast('Name fehlt');
      const cx = id ? state.stamm[k].find(y => y.id===id) : null;
      if(cx){ cx.nr = nr; cx.produkt = pr; if(ein) cx.ein = ein; else delete cx.ein; cx.done = document.getElementById('ei-done').checked; persist('stamm'); } else ensureAuftrag(nr, pr, ein);
    } else {
      const n = document.getElementById('ei-n').value.trim(); if(!n) return toast('Name fehlt');
      const fix = k==='masch' && document.getElementById('ei-fx').checked;
      let cx = id ? state.stamm[k].find(y => y.id===id) : null;
      const oldName = cx ? cx.name : null;
      if(cx){ cx.name = n; } else { ensureName(k, n); cx = state.stamm[k].find(y => y.name.toLowerCase() === n.toLowerCase()); }
      if(k==='masch' && cx){
        if(fix) cx.fix = true; else delete cx.fix;
        let rp = (document.getElementById('ei-rp').value || '').trim();
        if(oldName && oldName !== n && rp.endsWith(oldName)) rp = rp.slice(0, -oldName.length) + n;
        cx.rp = rp || defaultPhrase(n);
      }
      persist('stamm');
    }
    closeSheet(1); toast('Gespeichert');

  if(del) del.onclick = () => {

  };
