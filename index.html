/* ---------- Buchung bearbeiten ---------- */
// Maschinenzeit einer Buchung in Minuten (Vorbereitung = 0, sonst angepasst oder gemessen)
function machMin(e, now){ if(e.vb) return 0; if(e.mz != null) return +e.mz; return Math.round(entryDur(e, now || Date.now()).work / 60000); }
function editEntry(day, eid){
  const orig = eid ? state.days[day] && state.days[day][eid] : null;
  if(eid && !orig) return;
  if(orig && orig.fx) return editFixed(day, orig);
  const runObj = findRun(eid), running = !!runObj;
  const now = Date.now(), last = state.stamm.last || {};
  const e = orig ? clone(orig) : { a:null, t:last.t||'', m:'', s:parseDay(day).setHours(8,0,0,0), e:parseDay(day).setHours(9,0,0,0), p:[], note:'' };
  let aId = e.a ? (ensureAuftrag(e.a.nr, e.a.produkt)||{}).id : last.a;
  const mz0 = e.m ? machMin(e, now) : 0;
  const x = { day, s:hm(e.s), e:e.e?hm(e.e):'', t:e.t, m:e.m||'', note:e.note||'', mz: mz0 };
  let armed = false;
  const body = openSheet(1, { title: orig ? 'Buchung' : 'Nachtragen', right:'Sichern', onRight: save });
  const g = id => document.getElementById(id);
  const read = () => {
    if(!g('xe-day')) return;
    x.day = g('xe-day').value || x.day; x.s = g('xe-s').value; if(!running) x.e = g('xe-e').value;
    x.note = g('xe-n').value; if(g('xe-mz')) x.mz = g('xe-mz').value;
  };
  // Dauer aus Start/Ende (Pausen werden beim Ändern der Zeiten verworfen)
  const span = () => {
    if(!x.s || !x.e) return null;
    const [sh, sm] = x.s.split(':').map(Number), [eh, em] = x.e.split(':').map(Number);
    let m = (eh*60+em) - (sh*60+sm); if(m <= 0) m += 1440; return m;
  };
  const showMach = () => !running && x.m && !isFixM(x.m);
  const draw = () => {
    const sp = running ? null : (x.s === hm(e.s) && x.e === (e.e ? hm(e.e) : '') && orig ? Math.round(entryDur(e, now).work/60000) : span());
    body.innerHTML = `
      ${e.ab ? `<div class="subttl" style="text-align:center;margin-bottom:12px">${esc(e.ab.n)} · Schritt ${e.ab.i+1} von ${e.ab.of}</div>` : ''}
      <div class="sect"><div class="group">
        <label class="cell"><span class="cl">Datum</span><input type="date" id="xe-day" value="${x.day}"></label>
        <label class="cell"><span class="cl">Start</span><input type="time" id="xe-s" value="${x.s}"></label>
        <label class="cell"><span class="cl">Ende</span>${running ? '<span class="cv">läuft noch</span>' : `<input type="time" id="xe-e" value="${x.e}">`}</label>
        ${running ? '' : `<div class="cell"><span class="cl">Arbeitszeit</span><span class="cv tnum" id="xe-dur">${sp != null ? dur(sp*60000) : '–'}</span></div>`}
        ${showMach() ? `<label class="cell"><span class="cl two"><span>Maschinenzeit</span><small>⚙︎ ${esc(x.m)} · <span id="xe-mzh">${dur((+x.mz||0)*60000)} h</span></small></span><input type="number" id="xe-mz" min="0" inputmode="numeric" value="${x.mz}" style="width:70px"><span class="dim">min</span></label>` : ''}
      </div>${showMach() ? '<div class="foot">Maschinenzeit kannst du unabhängig von der Arbeitszeit anpassen, z. B. auf 0 für reine Vorbereitung.</div>' : ''}</div>
      <div class="sect"><div class="group">${pickCell('a','Auftrag',aVal(aById(aId)),'Wählen')}${pickCell('t','Tätigkeit',esc(x.t),'Wählen')}${pickCell('m','Maschine',esc(x.m),'Ohne')}</div></div>
      <div class="sect"><h2><span>Notiz</span></h2><div class="group"><div class="cell"><textarea id="xe-n" placeholder="Optional">${esc(x.note)}</textarea></div></div></div>
      ${orig && !running ? '<div class="group"><button class="cell danger" id="xe-del">Buchung löschen</button></div>' : ''}`;
    const upd = () => {
      const oldSpan = span(); read(); const ns = span();
      const d = g('xe-dur'); if(d) d.textContent = ns != null ? dur(ns*60000) : '–';
      // Maschinenzeit mitziehen, solange sie der Arbeitszeit entsprach
      if(g('xe-mz') && oldSpan != null && +x.mz === oldSpan && ns != null){ x.mz = ns; g('xe-mz').value = ns; }
      const h = g('xe-mzh'); if(h) h.textContent = dur((+x.mz||0)*60000) + ' h';
    };
    ['xe-s','xe-e'].forEach(id => { const el = g(id); if(el) el.onchange = upd; });
    const mzi = g('xe-mz'); if(mzi) mzi.oninput = () => { x.mz = mzi.value; g('xe-mzh').textContent = dur((+x.mz||0)*60000) + ' h'; };
    body.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => {
      read();
      const k = b.dataset.pk;
      const v = await pick({ a:'auftrag', t:'taet', m:'masch' }[k], k==='a' ? aId : x[k], k==='m' ? { none:'Ohne Maschine' } : {});
      if(v !== undefined){
        if(k==='a') aId = v; else x[k] = v;
        if(k==='m' && v && !orig) x.mz = span() || 0;
        draw();
      }
    });
    const del = g('xe-del');
    if(del) del.onclick = () => {
      if(!armed){ armed = true; del.textContent = 'Wirklich löschen?'; return; }
      delete state.days[day][e.id]; persist('d-'+day); closeSheet(1); toast('Gelöscht');
    };
  };
  function save(){
    read();
    const A = aById(aId);
    if(!A) return toast('Bitte Auftrag wählen');
    if(!x.t) return toast('Bitte Tätigkeit wählen');
    if(!x.s) return toast('Startzeit fehlt');
    const [sh, sm] = x.s.split(':').map(Number);
    const s = parseDay(x.day).setHours(sh, sm, 0, 0);
    const ne = { ...e, id: e.id || uid(), a:{ nr:A.nr, produkt:A.produkt }, t:x.t, m:x.m||'', s, note:x.note };
    if(!running){
      if(!x.e) return toast('Endzeit fehlt');
      const [eh, em] = x.e.split(':').map(Number);
      let end = parseDay(x.day).setHours(eh, em, 0, 0); if(end <= s) end += 86400000;
      ne.e = end;
      if(!orig || x.s !== hm(orig.s) || x.e !== hm(orig.e) || x.day !== day) ne.p = [];
      if(showMach()){
        const mz = Math.max(0, Math.round(+x.mz || 0));
        const auto = Math.round(entryDur(ne, now).work / 60000);
        if(mz !== auto || orig && orig.mz != null){ ne.mz = mz; } else delete ne.mz;
        delete ne.vb;
      } else if(!ne.m){ delete ne.mz; delete ne.vb; }
    }
    if(orig && x.day !== day){ delete state.days[day][e.id]; persist('d-'+day); if(runObj){ runObj.day = x.day; persist('aktiv'); } }
    state.days[x.day] = state.days[x.day] || {}; state.days[x.day][ne.id] = ne; persist('d-'+x.day);
    closeSheet(1); toast('Gespeichert');
  }
  draw();
}

function editFixed(day, orig){
  let armed = false;
  const body = openSheet(1, { title:'Maschinenbuchung', right:'Sichern', onRight: save });
  body.innerHTML = `<div class="subttl" style="text-align:center;margin-top:-8px">${esc(aOne(orig.a))} · ${esc(orig.m)}</div>
    <div class="sect"><div class="group">
      <label class="cell"><span class="cl">Datum</span><input type="date" id="xf-day" value="${day}"></label>
      <label class="cell"><span class="cl">Maschinenzeit</span><input type="number" id="xf-mt" min="0" inputmode="numeric" value="${+orig.mt||0}" style="width:70px"><span class="dim">min</span></label>
    </div><div class="foot">Feste Buchung – zählt nur als Maschinenzeit, nicht als Arbeitszeit.</div></div>
    <div class="sect"><h2><span>Notiz</span></h2><div class="group"><div class="cell"><textarea id="xf-n" placeholder="Optional">${esc(orig.note||'')}</textarea></div></div></div>
    <div class="group"><button class="cell danger" id="xf-del">Buchung löschen</button></div>`;
  function save(){
    const nd = document.getElementById('xf-day').value || day, mt = Math.max(0, Math.round(+document.getElementById('xf-mt').value || 0));
    const ne = { ...clone(orig), mt, note: document.getElementById('xf-n').value };
    if(nd !== day){ const t = new Date(orig.s); const s = parseDay(nd).setHours(t.getHours(), t.getMinutes(), 0, 0); ne.s = s; ne.e = s; delete state.days[day][orig.id]; persist('d-'+day); }
    state.days[nd] = state.days[nd] || {}; state.days[nd][ne.id] = ne; persist('d-'+nd);
    closeSheet(1); toast('Gespeichert');
  }
  const del = document.getElementById('xf-del');
  del.onclick = () => {
    if(!armed){ armed = true; del.textContent = 'Wirklich löschen?'; return; }
    delete state.days[day][orig.id]; persist('d-'+day); closeSheet(1); toast('Gelöscht');
  };
}

/* ---------- Arbeitsablauf bearbeiten ---------- */
function editAblauf(id){
  const st = state.stamm, orig = id ? st.ablaeufe.find(x => x.id===id) : null;
  let name = orig ? orig.name : '', steps = orig ? clone(orig.steps) : [{ t:'', m:'' }], armed = false;
  const body = openSheet(1, { title: orig ? 'Arbeitsablauf' : 'Neuer Arbeitsablauf', right:'Sichern', onRight: save });
  const readName = () => { const n = document.getElementById('ab-name'); if(n) name = n.value; };
  const draw = () => {
    body.innerHTML = `<div class="sect"><div class="group"><label class="cell"><input class="left" id="ab-name" value="${esc(name)}" placeholder="Name, z. B. Welle fertigen"></label></div></div>
      <div class="sect"><h2><span>Schritte</span></h2>
      ${steps.map((s,i) => `<div class="stepbox">
        <div class="stephead"><span>SCHRITT ${i+1}</span><span class="smini">
          <button data-up="${i}" ${i===0?'disabled':''} aria-label="hoch">↑</button><button data-dn="${i}" ${i===steps.length-1?'disabled':''} aria-label="runter">↓</button><button class="x" data-rs="${i}" aria-label="entfernen">✕</button></span></div>
        ${pickCell('t'+i,'Tätigkeit',esc(s.t),'Wählen')}${pickCell('m'+i,'Maschine',esc(s.m),'Ohne')}
        ${isFixM(s.m) ? `<label class="cell"><span class="cl two"><span>Feste Zeit</span><small>wird ohne Stoppuhr gebucht</small></span><input type="number" data-mt="${i}" min="1" inputmode="numeric" placeholder="0" value="${s.mt || ''}" style="width:70px"><span class="dim">min</span></label>` : ''}
        ${s.m && !isFixM(s.m) ? `<label class="cell"><span class="cl two"><span>Vorbereitungszeit</span><small>keine Maschinenstunden</small></span><input type="checkbox" class="sw" data-vb="${i}" ${s.vb?'checked':''}></label>` : ''}
      </div>`).join('')}
      <div class="group" style="background:var(--glass)"><button class="cell accent" id="ab-add" style="justify-content:center">＋ Schritt hinzufügen</button></div></div>
      ${orig ? '<div class="group" style="background:var(--glass)"><button class="cell danger" id="ab-del">Arbeitsablauf löschen</button></div>' : ''}`;
    body.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => {
      readName();
      const k = b.dataset.pk[0], i = +b.dataset.pk.slice(1);
      const v = await pick(k==='t' ? 'taet' : 'masch', steps[i][k], k==='m' ? { none:'Ohne Maschine' } : {});
      if(v !== undefined){ steps[i][k] = v; draw(); }
    });
    body.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { readName(); const i = +b.dataset.up; [steps[i-1], steps[i]] = [steps[i], steps[i-1]]; draw(); });
    body.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { readName(); const i = +b.dataset.dn; [steps[i+1], steps[i]] = [steps[i], steps[i+1]]; draw(); });
    body.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { readName(); steps.splice(+b.dataset.rs, 1); draw(); });
    document.getElementById('ab-add').onclick = () => { readName(); steps.push({ t:'', m:'' }); draw(); };
    body.querySelectorAll('[data-mt]').forEach(c => c.oninput = () => { steps[+c.dataset.mt].mt = Math.round(+c.value || 0); });
    body.querySelectorAll('[data-vb]').forEach(c => c.onchange = () => { const s = steps[+c.dataset.vb]; if(c.checked) s.vb = true; else delete s.vb; });
    const del = document.getElementById('ab-del');
    if(del) del.onclick = () => {
      if(!armed){ armed = true; del.textContent = 'Wirklich löschen?'; return; }
      state.stamm.ablaeufe = state.stamm.ablaeufe.filter(x => x.id !== id); persist('stamm'); closeSheet(1); toast('Gelöscht');
    };
  };
  function save(){
    readName();
    const missing = steps.findIndex(s => s.t && isFixM(s.m) && !(+s.mt > 0));
    if(missing >= 0) return toast('Bitte feste Zeit für Schritt ' + (missing+1) + ' eingeben');
    const clean = steps.filter(s => s.t).map(s => { const o = { t:s.t, m:s.m||'' }; if(s.m && s.vb && !isFixM(s.m)) o.vb = true; if(isFixM(s.m)) o.mt = Math.round(+s.mt); return o; });
    if(!name.trim()) return toast('Bitte einen Namen eingeben');
    if(!clean.length) return toast('Mindestens ein Schritt mit Tätigkeit');
    const cur = id ? state.stamm.ablaeufe.find(x => x.id===id) : null;
    if(cur){ cur.name = name.trim(); cur.steps = clean; } else state.stamm.ablaeufe.push({ id:uid(), name:name.trim(), steps:clean });
    persist('stamm'); closeSheet(1); toast('Arbeitsablauf gespeichert');
  }
  draw();
}

/* ---------- Export, Kopieren, Sicherung ---------- */
const STANDALONE = !(window.claude && window.claude.use);
async function offerFile(filename, text){
  if(!STANDALONE){
    try{
      const dl = await claude.use('downloads');
      if(dl){ await dl.save({ filename, data: text }); return true; }
    }catch(e){ if(e && /declin|cancel|abort|reject/i.test((e.code||'')+(e.message||''))) return false; }
  } else {
    const type = filename.endsWith('.csv') ? 'text/csv' : 'application/json';
    try{
      const file = new File([text], filename, { type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return true; }
    }catch(e){ if(e && e.name === 'AbortError') return false; }
    try{
      const url = URL.createObjectURL(new Blob([text], { type }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000); return true;
    }catch(e){}
  }
  const body = openSheet(1, { title:'Export', left:'Fertig' });
  body.innerHTML = `<div class="subttl" style="text-align:center">${esc(filename)}<br>Download geht hier nicht – kopiere den Text und füge ihn in Excel oder Numbers ein.</div>
    <div class="group"><div class="cell"><textarea id="ftxt" readonly style="min-height:240px;font-size:13px">${esc(text)}</textarea></div></div>
    <button class="cta blue" id="fcopy" style="margin-top:16px">Kopieren</button>`;
  document.getElementById('fcopy').onclick = () => copyText(text, document.getElementById('ftxt'));
}
// Kopieren als reiner Text: zuerst über ein markiertes Textfeld (funktioniert auch im eingebetteten Fenster), sonst Zwischenablage-API
function copyText(text, ta){
  let ok = false;
  try{
    const t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(t); t.focus(); t.select(); t.setSelectionRange(0, text.length);
    ok = document.execCommand('copy'); t.remove();
  }catch(e){}
  if(ok){ toast('In die Zwischenablage kopiert'); return; }
  try{
    const item = window.ClipboardItem ? new ClipboardItem({ 'text/plain': new Blob([text], { type:'text/plain' }) }) : null;
    (item ? navigator.clipboard.write([item]) : navigator.clipboard.writeText(text))
      .then(() => toast('In die Zwischenablage kopiert'))
      .catch(() => { if(ta){ ta.focus(); ta.select(); toast('Markiert – jetzt über „Kopieren“ im Menü kopieren'); } else toast('Kopieren nicht möglich'); });
  }catch(e){ if(ta){ ta.focus(); ta.select(); toast('Markiert – jetzt kopieren'); } else toast('Kopieren nicht möglich'); }
}
function importBackup(){
  const body = openSheet(1, { title:'Sicherung importieren', right:'Import', onRight: run });
  body.innerHTML = `<div class="subttl" style="text-align:center">Buchungen werden ergänzt, Listen zusammengeführt.</div>
    <div class="sect"><div class="group"><label class="cell accent"><span class="cl">Datei auswählen…</span><input type="file" id="impf" accept=".json,application/json" style="display:none"></label></div></div>
    <div class="sect"><h2><span>oder Inhalt einfügen</span></h2><div class="group"><div class="cell"><textarea id="impt" style="min-height:140px"></textarea></div></div></div>`;
  document.getElementById('impf').onchange = async ev => { const f = ev.target.files[0]; if(f) document.getElementById('impt').value = await f.text(); };
  function run(){
    try{
      const d = JSON.parse(document.getElementById('impt').value);
      if(!d || !d.days || !d.stamm) throw 0;
      for(const k in d.days){ state.days[k] = Object.assign(state.days[k]||{}, d.days[k]); persist('d-'+k); }
      const st = state.stamm;
      (d.stamm.taet||[]).forEach(x => ensureName('taet', x.name));
      (d.stamm.masch||[]).forEach(x => { const n = ensureName('masch', x.name); const m = st.masch.find(y => y.name === n); if(m && x.fix){ m.fix = true; } if(m && x.rp && !m.rp){ m.rp = x.rp; } });
      (d.stamm.auftraege||[]).forEach(x => { const a = ensureAuftrag(x.nr, x.produkt, x.ein); if(a && x.done) a.done = true; });
      (d.stamm.ablaeufe||[]).forEach(x => { if(!st.ablaeufe.some(y => y.id===x.id)) st.ablaeufe.push(x); });
      persist('stamm'); closeSheet(1); toast('Import erfolgreich');
    }catch(e){ toast('Ungültige Sicherung'); }
  }
}

/* ---------- Start ---------- */
// Übergänge im Apple-Stil: nur wenn navAnim gesetzt ist (nicht bei Uhr-/Daten-Updates)
let navAnim = null;
function go(anim, fn){ navAnim = anim; fn(); }
function playAnim(name){
  if(!name || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  view.classList.remove('a-tab','a-push','a-pop','a-fsin','a-fsout','a-fade','a-left','a-right');
  void view.offsetWidth;
  view.classList.add('a-' + name);
  clearTimeout(playAnim.t); playAnim.t = setTimeout(() => view.classList.remove('a-' + name), 700);
}
function render(){
  const wasFs = document.body.classList.contains('fs');
  ensurePhrases();
  document.body.classList.remove('fs');
  document.body.classList.remove('vbmode');
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  ({ stopp:renderStopp, ausw:renderAusw, buch:renderBuch, einst:renderEinst })[tab]();
  renderMini();
  moveTabPill();
  const isFs = document.body.classList.contains('fs');
  let a = navAnim; navAnim = null;
  if(!wasFs && isFs) a = 'fsin'; else if(wasFs && !isFs) a = 'fsout';
  playAnim(a);
}
// gleitende Markierung in der Tab-Leiste
function moveTabPill(){
  const bar = document.querySelector('.tabbar'); if(!bar) return;
  let pill = bar.querySelector('.tabpill');
  if(!pill){ pill = document.createElement('span'); pill.className = 'tabpill'; bar.prepend(pill); }
  const on = bar.querySelector('button.on'); if(!on) return;
  const br = bar.getBoundingClientRect(), r = on.getBoundingClientRect();
  if(!r.width) return;
  pill.style.width = r.width + 'px'; pill.style.transform = `translateX(${r.left - br.left - 5}px)`;
}
window.addEventListener('resize', moveTabPill);
document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => { if(b.dataset.tab===tab && !(tab==='einst' && einSub)) return; if(tab==='einst' && b.dataset.tab==='einst'){ einSub = null; navAnim = 'pop'; } else navAnim = 'tab'; tab = b.dataset.tab; buzz(); render(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !sheetOpen()) render(); });
loadLocal();
render();
initCloud();
if(STANDALONE){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    const lb = +localStorage.getItem('zs-lastbackup') || 0;
    if(Object.keys(state.days).length && Date.now() - lb > 7*86400000) setTimeout(() => toast('Zeit für eine Sicherung – unter „Verwalten“'), 1500);
  }catch(e){}
}
